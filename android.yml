name: Criar aplicativo Android
on:
  workflow_dispatch:
  push:
    paths: ["index.html", "package.json", "capacitor.config.json", ".github/workflows/android.yml"]
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Preparar o aplicativo
        run: |
          mkdir -p www
          cp index.html www/index.html
          [ -f fixtures.json ] && cp fixtures.json www/fixtures.json || true
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Aplicar o ícone
        run: |
          # o ícone (leão azul com coroa) vem de dentro do próprio index.html (<link rel="icon" href="data:image/png;base64,...">),
          # para não depender de nenhum ficheiro de imagem à parte no repositório
          SRC=icone-fonte.png
          B64=$(grep -oP '(?<=<link rel="icon" href="data:image/png;base64,)[^"]+' index.html | head -1)
          if [ -z "$B64" ]; then echo "ERRO: não encontrei o ícone embutido (data:image/png;base64,...) dentro do index.html."; exit 1; fi
          echo "$B64" | base64 -d > "$SRC"
          echo "Ícone extraído do index.html:"
          identify "$SRC" || { echo "ERRO: o ícone embutido no index.html não abre como imagem."; exit 1; }
          IM=convert; command -v convert >/dev/null || IM="magick"
          RES=android/app/src/main/res
          # ícone com nome próprio (eb_launcher): nada do modelo do Capacitor o pode substituir
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; px=${d##*:}; mkdir -p $RES/mipmap-$n
            $IM "$SRC[0]" -resize ${px}x${px}^ -gravity center -background none -extent ${px}x${px} PNG32:$RES/mipmap-$n/eb_launcher.png
            # também por cima dos nomes antigos
            for name in ic_launcher ic_launcher_round ic_launcher_foreground; do cp $RES/mipmap-$n/eb_launcher.png $RES/mipmap-$n/$name.png; done
          done
          # remove os recursos de ícone adaptável (mascarado/cortado); fica só o bitmap completo acima, sem corte
          rm -rf $RES/mipmap-anydpi-v26 $RES/mipmap-anydpi $RES/drawable-v24/ic_launcher_foreground.xml $RES/drawable/ic_launcher_background.xml $RES/values/ic_launcher_background.xml
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:icon="[^"]*"#android:icon="@mipmap/eb_launcher"#; s#android:roundIcon="[^"]*"#android:roundIcon="@mipmap/eb_launcher"#' $MAN
          grep -q 'android:icon="@mipmap/eb_launcher"' $MAN || { echo "ERRO: não consegui apontar o AndroidManifest ao novo ícone."; exit 1; }
          grep -n 'android:icon\|android:roundIcon' $MAN
          ls -la $RES/mipmap-xxxhdpi/
          cp $RES/mipmap-xxxhdpi/eb_launcher.png icone-usado.png
          echo "Ícones criados e ligados ao AndroidManifest (ícone completo, sem corte do ícone adaptável)."
      - name: Construir o APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Confirmar o ícone dentro do APK
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 2>/dev/null | tail -1)
          [ -n "$AAPT" ] && $AAPT dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -E "application-icon|launchable-activity" || echo "(aapt2 não encontrado)"
      - uses: actions/upload-artifact@v4
        with:
          name: Elephalpit-Bet-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: icone-usado
          path: icone-usado.png
