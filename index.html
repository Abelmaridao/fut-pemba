<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elephalpit Bet</title>
<style>
:root{--bg:#f1f6fc;--card:#fff;--ink:#0f1f3a;--mute:#5b6b85;--line:#cfe3f7;--blue:#0b5ec5;--blue2:#1478e0;--amber:#f2b705;--ok:#1fa463;--bad:#d93025;--grey:#9aa7ba;--hdr:#0b5ec5;--tint:#eaf3fd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131d31;--ink:#e8eefb;--mute:#93a3bf;--line:#243452;--blue:#2f86ea;--blue2:#5aa2f5;--hdr:#0a3f86;--tint:#18253d}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131d31;--ink:#e8eefb;--mute:#93a3bf;--line:#243452;--blue:#2f86ea;--blue2:#5aa2f5;--hdr:#0a3f86;--tint:#18253d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
header.top{position:sticky;top:0;z-index:5;background:var(--hdr);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}

.ib svg{width:28px;height:28px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:.2px}
.brand em{font-style:normal;color:#9cc9ff}
.mark{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font-size:18px}
main{max-width:760px;margin:0 auto;padding:12px 12px calc(88px + env(safe-area-inset-bottom,0px))}
.ttl{font-size:24px;text-align:center;margin:8px 0 12px}
.sub{color:var(--mute);font-size:14px;margin:0 0 8px;text-align:center}
.comp{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.ball{font-size:30px;text-align:center}
.ct b{display:block;font-size:18px}
.ct i{color:var(--blue2);display:flex;align-items:center;gap:6px;font-size:16px}
.cnt{border:1px solid var(--line);background:var(--tint);border-radius:6px;padding:4px 10px;font-size:14px;color:var(--blue2);white-space:nowrap}
.cnt b{font-size:24px}
.msg{margin:8px 0;padding:10px 12px;border-radius:8px;font-size:14px;background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}

.empty{text-align:center;color:var(--mute);padding:36px 12px}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--hdr);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}

nav.bot button[aria-current=page]{color:#fff;font-weight:800}
nav.bot svg{width:28px;height:28px}
.ov{position:fixed;inset:0;z-index:20;background:#0009;display:flex}

.rp{display:grid;grid-template-columns:1fr 64px 42px 14px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:15px}

.rp strong{text-align:right}

.dot.g{background:var(--ok)}.dot.r{background:var(--bad)}.dot.n{border:2px solid var(--grey)}

.strip::-webkit-scrollbar{display:none}
.dy{background:none;border:0;border-radius:10px;min-width:54px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;color:var(--mute);font-size:15px;font-weight:600}

.dy[aria-pressed=true] i.has{background:#fff}
.nx{background:none;border:0;font-size:26px;color:var(--mute);padding:0 10px}
.sum{background:var(--tint);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 8px;font-size:14px}

<body>
<div id="app"></div>
<div id="ov"></div>
<dialog id="dlg"></dialog>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let S = { view: "home", compId: null, raw: [], rawHist: [], fixtures: [], history: [], hidden: new Set(store.get("hiddenHist", [])), leagues: [], lastSync: null, msg: null, loading: true, tab: "all", comp: "", day: "",
  tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
  theme: store.get("theme", "auto"), drawer: false, search: false, q: "",
  na: { home: "", away: "", league: "" }, favs: store.get("favSearch", []), ext: null };

/* MODEL:BEGIN (gerado a partir de model.ts) */
const MODEL = (() => {
// Modelo estatístico "poisson-v2": puro, sem dependências, testável.
const MODEL_VERSION = "poisson-v2";
const MIN_MATCHES = 5;      // sem isto não se apresenta previsão quantitativa
const SHRINK_K = 5;         // jogos "virtuais" da média da amostra (reduz extremos)
const HOME_ADV = 1.1;       // fator casa: λ_casa × 1.1, λ_fora ÷ 1.1
const HT_SHARE = 0.45;      // fração aproximada dos golos na 1.ª parte
const MIN10_SHARE = 0.10;   // fração aproximada dos golos nos primeiros 10 minutos
const MAXG = 10;
const fact = (n) => { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; };
const pois = (k, l) => Math.exp(-l) * Math.pow(l, k) / fact(k);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
function grid(lh, la) {
  const g= []; let tot = 0;
  for (let i = 0; i <= MAXG; i++) { g[i] = []; for (let j = 0; j <= MAXG; j++) { g[i][j] = pois(i, lh) * pois(j, la); tot += g[i][j]; } }
  for (const row of g) for (let j = 0; j <= MAXG; j++) row[j] /= tot; // normaliza a truncagem
  return g;
}
function result1x2(g) {
  let h = 0, d = 0, a = 0;
  g.forEach((row, i) => row.forEach((p, j) => { if (i > j) h += p; else if (i === j) d += p; else a += p; }));
  return { home: h, draw: d, away: a };
}
function analyze(inp){
  const valid = (m) => Number.isFinite(m.gf) && Number.isFinite(m.ga) && m.gf >= 0 && m.ga >= 0;
  const H = inp.home.filter(valid), A = inp.away.filter(valid);
  if (H.length < MIN_MATCHES || A.length < MIN_MATCHES)
    return { ok: false, reason: `Dados insuficientes: são precisos pelo menos ${MIN_MATCHES} jogos recentes de cada equipa (tem ${H.length} e ${A.length}).` };
  const all = [...H, ...A];
  const mu = Math.max(0.3, all.reduce((s, m) => s + m.gf, 0) / all.length); // média de golos por equipa/jogo na amostra
  const str = (ms) => {
    const n = ms.length, gf = ms.reduce((s, m) => s + m.gf, 0), ga = ms.reduce((s, m) => s + m.ga, 0);
    return { att: (gf + SHRINK_K * mu) / (n + SHRINK_K) / mu, def: (ga + SHRINK_K * mu) / (n + SHRINK_K) / mu };
  };
  const h = str(H), a = str(A);
  const lh = clamp(mu * h.att * a.def * HOME_ADV, 0.2, 4.5);
  const la = clamp(mu * a.att * h.def / HOME_ADV, 0.2, 4.5);
  const g = grid(lh, la);
  const total = (k, over) => { let p = 0; g.forEach((r, i) => r.forEach((q, j) => { if ((i + j > k) === over) p += q; })); return p; };
  const totals= {};
  for (const k of [0.5, 1.5, 2.5, 3.5]) totals[`over_${String(k).replace(".", "_")}`] = total(k, true);
  for (const k of [1.5, 2.5, 3.5]) totals[`under_${String(k).replace(".", "_")}`] = total(k, false);
  let yes = 0; g.forEach((r, i) => r.forEach((q, j) => { if (i > 0 && j > 0) yes += q; }));
  const tg = (l) => { const p0 = pois(0, l), p1 = pois(1, l), p2 = pois(2, l); return { "0": p0, "1": p1, "2": p2, "3+": 1 - p0 - p1 - p2 }; };
  const scores= [];
  g.forEach((r, i) => r.forEach((q, j) => scores.push({ score: `${i}-${j}`, p: q })));
  scores.sort((x, y) => y.p - x.p);
  const none = g[0][0];
  // Parte mais produtiva: golos da 1.ª vs 2.ª parte (Poisson independentes, taxa total × fração da parte)
  const lt = lh + la, h1 = HT_SHARE, h2 = 1 - HT_SHARE;
  let pf = 0, pd = 0, ps = 0, ptot = 0;
  for (let i = 0; i <= MAXG; i++) for (let j = 0; j <= MAXG; j++) {
    const p = pois(i, lt * h1) * pois(j, lt * h2); ptot += p;
    if (i > j) pf += p; else if (i === j) pd += p; else ps += p;
  }
  // Uma equipa marca nas duas partes: P(≥1 na 1.ª) × P(≥1 na 2.ª)
  const both = (l) => { const y = (1 - Math.exp(-l * h1)) * (1 - Math.exp(-l * h2)); return { yes: y, no: 1 - y }; };
  // Alcance de golos: P(total ≥ n)
  const ge = (n) => { let p = 0; g.forEach((r, i) => r.forEach((q, j) => { if (i + j >= n) p += q; })); return p; };
  const nm = Math.min(H.length, A.length);
  return {
    ok: true, model: MODEL_VERSION, lambda: { home: lh, away: la },
    result: result1x2(g), totals, btts: { yes, no: 1 - yes },
    halftime: result1x2(grid(lh * HT_SHARE, la * HT_SHARE)),
    teamGoals: { home: tg(lh), away: tg(la) },
    exactScores: scores.slice(0, 5),
    productiveHalf: { first: pf / ptot, draw: pd / ptot, second: ps / ptot },
    bothHalves: { home: both(lh), away: both(la) },
    reach: { ge3: ge(3), ge4: ge(4), ge5: ge(5), ge6: ge(6) },
    min10: result1x2(grid(lh * MIN10_SHARE, la * MIN10_SHARE)),
    firstToScore: { home: (1 - none) * lh / (lh + la), away: (1 - none) * la / (lh + la), none },
    quality: { homeMatches: H.length, awayMatches: A.length, level: nm >= 10 ? "boa" : nm >= 7 ? "razoavel" : "baixa" },
  };
}
return { analyze, MODEL_VERSION };
})();
/* MODEL:END */

/* Fonte de dados para ligas FORA das 10 (ainda não ligada).
   Contrato: find({home, away, league, from, to}) -> { event:{id, home, away, league, kickoff_utc, time_confirmed}, homeHistory:[{gf,ga}], awayHistory:[{gf,ga}] }
   Em caso de erro lança Error com .code = "notfound" | "league" | "offline". */
const EXTRA_SOURCE = null;

/* ---------- Tema ---------- */
function applyTheme(){ const r = document.documentElement; if (S.theme === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.theme); }
const isDark = () => S.theme === "dark" || (S.theme === "auto" && !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches));
function setTheme(t){ S.theme = t; store.set("theme", t); applyTheme(); drawerHtml(); }

/* ---------- Dados ---------- */
async function fetchData(){
  try {
    const r = await fetch("fixtures.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    S.raw = d.matches ?? []; S.rawHist = d.history ?? []; S.leagues = d.leagues ?? [];
    S.lastSync = d.lastSuccessAt ?? null;
    const bad = S.leagues.filter(l => !l.ok);
    S.msg = bad.length ? `Sem atualização recente em: ${bad.map(l => l.name).join(", ")}. Os jogos já guardados foram mantidos.` : null;
    return true;
  } catch { S.msg = "Sem ligação ao servidor. O app precisa de internet para mostrar os jogos e as análises."; return false; }
}
async function load(){ S.loading = true; render(); await fetchData(); S.loading = false; render(); }

/* ---------- Formatação ---------- */
const STATUS = { NS:"Agendada", TBD:"Hora por confirmar", "1H":"Ao vivo", HT:"Intervalo", "2H":"Ao vivo", ET:"Ao vivo", P:"Ao vivo", LIVE:"Ao vivo",
  FT:"Terminada", AWD:"Resultado atribuído", PST:"Adiada", CANC:"Cancelada", SUSP:"Suspensa" };
const isLive = s => ["1H","HT","2H","ET","P","LIVE"].includes(s);
const isDone = s => ["FT","AWD"].includes(s);
const fmtDay = iso => new Intl.DateTimeFormat("pt", { timeZone: S.tz, weekday:"long", day:"numeric", month:"long" }).format(new Date(iso));
const fmtHour = iso => new Intl.DateTimeFormat("pt", { timeZone: S.tz, hour:"2-digit", minute:"2-digit" }).format(new Date(iso));
const fmtFull = iso => new Intl.DateTimeFormat("pt", { timeZone: S.tz, dateStyle:"short", timeStyle:"short" }).format(new Date(iso));
const dayKey = iso => new Intl.DateTimeFormat("en-CA", { timeZone: S.tz }).format(new Date(iso));
const ORDER = ["CL","PL","PD","ELC","BL1","SA","DED","PPL","BSA","FL1"];
const LABEL = { CL:["Clubes internacionais","Liga dos campeões UEFA"], PL:["Inglaterra","Premier League"], PD:["Espanha","La Liga"],
  ELC:["Inglaterra 2","Championship"], BL1:["Alemanha","Bundesliga"], SA:["Itália","Série A"], DED:["Países Baixos","Eredivisie"],
  PPL:["Portugal","Primeira Liga"], BSA:["Brasil","Brasileirão Série A"], FL1:["França","Ligue 1"] };
const labelById = (id, name, country) => LABEL[id] ?? [country || "", name || id];
const countOf = id => S.fixtures.filter(f => f.competition_id === id).length;
const norm = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

/* ---------- Componentes ---------- */
const ICON = {
  menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  live: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="2.6" fill="currentColor"/><path d="M7.5 7.5a6.4 6.4 0 0 0 0 9M16.5 7.5a6.4 6.4 0 0 1 0 9M4.5 4.5a10.6 10.6 0 0 0 0 15M19.5 4.5a10.6 10.6 0 0 1 0 15"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="8" cy="14" r=".8" fill="currentColor"/><circle cx="12" cy="14" r=".8" fill="currentColor"/><circle cx="16" cy="14" r=".8" fill="currentColor"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17.5 6.1 20.7l1.2-6.6L2.5 9.5l6.6-.9z"/></svg>',
  hist: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5M3.5 4v4.5H8"/><path d="M12 7.5V12l3 2"/></svg>'
};
function header(){
  return `<header class="top"><button class="ib" data-act="drawer" aria-label="Definições">${ICON.menu}</button>
    <div class="brand"><span class="mark" aria-hidden="true">🦁</span><span>Elephalpit <em>Bet</em></span></div>
    <button class="ib" data-act="search" aria-label="Pesquisar equipas">${ICON.search}</button></header>`;
}
function nav(){
  const it = [["home","Home",ICON.home],["live","AO VIVO",ICON.live],["cal","Calendário",ICON.cal],["fav","Favoritos",ICON.star],["hist","Histórico",ICON.hist]];
  return `<nav class="bot">${it.map(([k,l,i]) => `<button data-nav="${k}" ${S.view === k || (k === "home" && S.view === "comp") ? 'aria-current="page"' : ""}>${i}<span>${l}</span></button>`).join("")}</nav>`;
}
function matchCard(f, mode){
  const logo = u => u ? `<img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : "";
  const done = isDone(f.status);
  const score = f.home_goals != null && f.away_goals != null && f.status !== "NS" && f.status !== "TBD" ? `${f.home_goals} - ${f.away_goals}` : "vs";
  const top = f.time_confirmed ? `${dayKey(f.kickoff_utc)} ${fmtHour(f.kickoff_utc)}` : `${dayKey(f.kickoff_utc)} · hora por confirmar`;
  let action;
  if (done) action = f.analysis ? `<button class="btn" data-an="${esc(f.id)}">Ver estatísticas</button>` : `<span class="note">Sem previsão guardada</span>`;
  else action = `<button class="btn amber" data-an="${esc(f.id)}" ${["NS","TBD"].includes(f.status) ? "" : "disabled"}>Analisar com IA</button>`;
  const del = mode === "hist" ? `<button class="x" data-del="${esc(f.id)}" aria-label="Remover este jogo do histórico">✕</button>` : "";
  return `<article class="match">${del}<div class="dt">${esc(top)}</div><div class="teams">
    <div class="t">${logo(f.home_logo)}<span>${esc(f.home_team)}</span></div><div class="vs">${esc(score)}</div>

const DAY = 86400e3;
const coded = (code, msg) => Object.assign(new Error(msg || code), { code });
const loose = (a, b) => { a = norm(a).trim(); b = norm(b).trim(); return !!a && !!b && (a.includes(b) || b.includes(a)); };
function errText(e){
  return ({ nosource: "Essa liga não está nas 10 do app e a fonte de dados para outras ligas ainda não está ligada, por isso não é possível procurar o jogo.",
    offline: "Sem ligação à internet. Esta análise precisa de estar online.",
    notfound: "Jogo não encontrado. Só aparecem jogos já publicados e dentro dos próximos 7 dias." })[e.code] || e.message || "Não foi possível fazer a análise.";
}
const nameOk = (typed, name) => { const t = norm(typed).split(/\s+/).filter(w => w.length >= 2), n = norm(name); return t.length > 0 && t.every(w => n.includes(w)); };
const aliasesOf = f => [f.competitions?.name, f.competitions?.country, ...(LABEL[f.competition_id] ?? [])].filter(Boolean);
const leagueOk = (f, typed) => aliasesOf(f).some(a => loose(a, typed));
const knownLeague = typed => ORDER.some(id => [...(LABEL[id] ?? []), S.leagues.find(l => l.id === id)?.name ?? ""].some(a => loose(a, typed)));
// Procura nos jogos das 10 competições (dados já importados e analisados), sempre depois de ir ao servidor
async function lookupInternal(q, now, to){
  if (!(await fetchData())) throw coded("offline");
  reclassify();
  const open = S.fixtures.filter(f => ["NS", "TBD"].includes(f.status) && Date.parse(f.kickoff_utc) >= now && Date.parse(f.kickoff_utc) <= to);
  const hit = open.filter(f => nameOk(q.home, f.home_team) && nameOk(q.away, f.away_team) && leagueOk(f, q.league)).sort((a, b) => a.kickoff_utc.localeCompare(b.kickoff_utc))[0];
  if (!hit){
    const swapped = open.find(f => nameOk(q.home, f.away_team) && nameOk(q.away, f.home_team) && leagueOk(f, q.league));
    if (swapped) throw coded("swapped", `Encontrei o jogo, mas com a casa e o visitante trocados: casa ${swapped.home_team}, fora ${swapped.away_team}. Troca os campos.`);
    const other = open.find(f => nameOk(q.home, f.home_team) && nameOk(q.away, f.away_team));
    if (other) throw coded("league", `Encontrei esse jogo noutra competição (${other.competitions?.name}). Escreve essa liga para analisar.`);
    return null;
  }
  if (!hit.analysis) throw coded("insufficient", hit.analysis_note || "Ainda não há análise para este jogo.");
  const qa = hit.analysis.result.quality ?? {};
  return { f: { id: "fx:" + hit.id, home_team: hit.home_team, away_team: hit.away_team, competitions: hit.competitions, kickoff_utc: hit.kickoff_utc, time_confirmed: hit.time_confirmed, status: "NS" },
    an: hit.analysis, q,
    note: `Base: últimos ${qa.homeMatches ?? "?"} jogos da casa e ${qa.awayMatches ?? "?"} do visitante. Qualidade dos dados: ${qa.level ?? "?"}. Fonte: football-data.org (competições do app).` };
}
async function lookup(q){
  const now0 = Date.now(), to0 = now0 + 7 * DAY;
  const internal = await lookupInternal(q, now0, to0);
  if (internal) return internal;
  if (!EXTRA_SOURCE) throw coded(knownLeague(q.league) ? "notfound" : "nosource");
  const now = Date.now(), to = now + 7 * DAY;
  let res;
  try { res = await EXTRA_SOURCE.find({ ...q, from: new Date(now).toISOString(), to: new Date(to).toISOString() }); }
  catch (err){ throw err && err.code ? err : coded("offline"); }
  const ev = res && res.event;
  if (!ev) throw coded("notfound");
  const t = Date.parse(ev.kickoff_utc);
  if (!(t >= now && t <= to)) throw coded("notfound"); // regra do app: só jogos publicados dos próximos 7 dias
  if (ev.league && !loose(ev.league, q.league)) throw coded("league", `Encontrei esse jogo noutra competição (${ev.league}). Escreve essa liga para analisar.`);
  const out = MODEL.analyze({ home: res.homeHistory ?? [], away: res.awayHistory ?? [] });
  if (!out.ok) throw coded("insufficient", out.reason);
  const f = { id: "ext:" + ev.id, home_team: ev.home, away_team: ev.away, competitions: { name: ev.league || q.league, country: "" },
    kickoff_utc: ev.kickoff_utc, time_confirmed: ev.time_confirmed !== false, status: "NS" };
  const an = { model_version: MODEL.MODEL_VERSION, created_at: new Date().toISOString(), result: out };
  const note = `Base: últimos ${out.quality.homeMatches} jogos da casa e ${out.quality.awayMatches} do visitante. Qualidade dos dados: ${out.quality.level}. Fonte: ${EXTRA_SOURCE.name ?? "externa"}.`;
  return { f, an, note, q };
}

/* ---------- Análise e avaliação (círculos verde/vermelho) ---------- */
const pc = p => p == null ? "—" : (p * 100).toFixed(0) + "%";
const ck = k => k.replace(".", ",");
function sections(r){
  const t = r.totals, S1 = [];
  S1.push({ title: "Resultado final", groups: [[["Casa", r.result.home, f => f.h > f.a], ["Empate", r.result.draw, f => f.h === f.a], ["Fora", r.result.away, f => f.h < f.a]]] });
  const tg = [];
  for (const [k, key] of [["0.5","0_5"],["1.5","1_5"],["2.5","2_5"],["3.5","3_5"]]){
    const g = [[`Mais de ${ck(k)}`, t["over_" + key], f => f.h + f.a > +k]];
    if (t["under_" + key] != null) g.push([`Menos de ${ck(k)}`, t["under_" + key], f => f.h + f.a < +k]);
    tg.push(g);
  }
  S1.push({ title: "Total de golos", groups: tg });
  if (r.reach) S1.push({ title: "Alcance de golos", groups: [[3, r.reach.ge3], [4, r.reach.ge4], [5, r.reach.ge5], [6, r.reach.ge6]].map(([n, p]) => [[`${n}+`, p, f => f.h + f.a >= n]]) });
  S1.push({ title: "Ambas as equipas marcam", groups: [[["Sim", r.btts.yes, f => f.h > 0 && f.a > 0], ["Não", r.btts.no, f => !(f.h > 0 && f.a > 0)]]] });
  const ht = f => f.hh == null || f.ah == null;
  S1.push({ title: "Resultado ao intervalo", groups: [[["Casa", r.halftime.home, f => ht(f) ? null : f.hh > f.ah], ["Empate", r.halftime.draw, f => ht(f) ? null : f.hh === f.ah], ["Fora", r.halftime.away, f => ht(f) ? null : f.hh < f.ah]]] });
  const noHt = f => f.hh == null || f.ah == null;
  const g1 = f => f.hh + f.ah, g2 = f => f.h + f.a - (f.hh + f.ah);
  if (r.productiveHalf) S1.push({ title: "Parte mais produtiva", groups: [[["Primeira parte", r.productiveHalf.first, f => noHt(f) ? null : g1(f) > g2(f)], ["Empate", r.productiveHalf.draw, f => noHt(f) ? null : g1(f) === g2(f)], ["Segunda parte", r.productiveHalf.second, f => noHt(f) ? null : g1(f) < g2(f)]]] });
  if (r.bothHalves){
    const bh = (side, key) => { const y = f => noHt(f) ? null : (side === "h" ? f.hh > 0 && f.h - f.hh > 0 : f.ah > 0 && f.a - f.ah > 0); return [["Sim", r.bothHalves[key].yes, y], ["Não", r.bothHalves[key].no, f => { const v = y(f); return v === null ? null : !v; }]]; };
    S1.push({ title: "1 marca duas partes (casa)", groups: [bh("h", "home")] });
    S1.push({ title: "2 marca duas partes (fora)", groups: [bh("a", "away")] });
  }
  if (r.min10) S1.push({ title: "1X2 aos 10 minutos", groups: [[["Casa vence", r.min10.home, () => null], ["Empate", r.min10.draw, () => null], ["Fora vence", r.min10.away, () => null]]] });
  const bucket = (obj, side) => Object.entries(obj).map(([k, p]) => [`${k} golo${k === "1" ? "" : "s"}`, p, f => (k === "3+" ? f[side] >= 3 : f[side] === +k)]);
  S1.push({ title: "Golos da equipa da casa", groups: [bucket(r.teamGoals.home, "h")] });
  S1.push({ title: "Golos da equipa visitante", groups: [bucket(r.teamGoals.away, "a")] });
  S1.push({ title: "Resultados exatos mais prováveis", groups: [r.exactScores.map(x => [x.score, x.p, f => `${f.h}-${f.a}` === x.score])] });
  S1.push({ title: "Quem marca primeiro", groups: [[["Casa", r.firstToScore.home, () => null], ["Fora", r.firstToScore.away, () => null], ["Sem golos", r.firstToScore.none, f => (f.h + f.a === 0)]]] });
  S1.push({ title: "Total de cantos", groups: [6, 7, 8, 9, 10].map(n => [[`${n}+`, null, () => null]]), note: "Sem percentagens: a fonte de dados gratuita não fornece cantos, por isso não é possível calcular esta previsão com dados reais." });
  return S1;
}
// Regra: num mercado com várias opções o modelo "escolhe" a mais provável; com uma só linha, escolhe "acontece" se p >= 50%.
// Cada linha fica verde se a escolha do modelo para essa linha coincidiu com o que aconteceu, vermelha se não, cinzenta se não há dados.
function evalGroup(items, fin){
  const top = items.length > 1 ? items.reduce((b, x, i) => (x[1] > items[b][1] ? i : b), 0) : -1;
  const rows = items.map(([l, p, fn], i) => {
    let ok = null;
    if (fin){ const occ = fn(fin); if (occ !== null && occ !== undefined){ const pred = items.length === 1 ? p >= 0.5 : i === top; ok = pred ? occ : !occ; } }
    return { l, p, ok };
  });
  let hit = null;
  if (fin){ const i = items.length === 1 ? 0 : top, o = items[i][2](fin); if (o !== null && o !== undefined) hit = items.length === 1 ? ((items[0][1] >= 0.5) === o) : o; }
  return { rows, hit };
}
function analysisHtml(an, f, extra = ""){
  const r = an.result, q = r.quality, fin = isDone(f.status) ? finalOf(f) : null;
  const dot = ok => !fin ? "<span></span>" : `<span class="dot ${ok === true ? "g" : ok === false ? "r" : "n"}" role="img" aria-label="${ok === true ? "Acertou" : ok === false ? "Falhou" : "Sem dados para avaliar"}"></span>`;
  const secs = sections(r).map(sec => `<div class="sec">${esc(sec.title)}</div>` + (sec.note ? `<p class="note">${esc(sec.note)}</p>` : "") + sec.groups.map(g => evalGroup(g, fin).rows.map(x =>
    `<div class="rp"><span>${esc(x.l)}</span><span class="trk"><span style="width:${x.p == null ? 0 : Math.max(0, x.p * 100).toFixed(0)}%"></span></span><strong>${x.p == null ? "—" : pc(x.p)}</strong>${dot(x.ok)}</div>`).join("")).join("")).join("");
  const legend = fin ? `<p class="note"><span class="dot g"></span> o modelo acertou nesta linha · <span class="dot r"></span> falhou · <span class="dot n"></span> sem dados para avaliar (por exemplo, quem marca primeiro e o 1X2 aos 10 minutos). Resultado final: ${fin.h} - ${fin.a}.</p>` : "";
  // As 5 linhas com maior probabilidade em todos os mercados (sem repetir probabilidades idênticas, ex.: "3+" = "Mais de 2,5")
  const all = [];
  for (const sec of sections(r)) for (const g of sec.groups) evalGroup(g, fin).rows.forEach(x => { if (x.p != null) all.push({ ...x, sec: sec.title }); });
  all.sort((a, b) => b.p - a.p);
  const top5 = [];
  for (const x of all){ if (top5.some(t => Math.abs(t.p - x.p) < 1e-9)) continue; top5.push(x); if (top5.length === 5) break; }
  const topHtml = top5.map(x => `<div class="rp"><span>${esc(x.l)}<br><small style="color:var(--mute)">${esc(x.sec)}</small></span><span class="trk"><span style="width:${Math.max(0, x.p * 100).toFixed(0)}%"></span></span><strong>${pc(x.p)}</strong>${dot(x.ok)}</div>`).join("");
  return `<h3 style="font-size:22px;margin:0">${esc(f.home_team)} vs ${esc(f.away_team)}</h3>
    <p class="note">${esc(f.competitions?.name ?? "")} · ${esc(fmtDay(f.kickoff_utc))}, ${esc(fmtHour(f.kickoff_utc))}</p>${legend}${secs}
    <div class="sec">As 5 análises mais prováveis deste jogo</div>${topHtml}
    <p class="note">Previsão calculada em ${esc(fmtFull(an.created_at))}${fin ? " (antes do jogo; nunca é alterada)" : ""}. São estimativas estatísticas, não garantias.</p>
    ${extra}
    <form method="dialog"><button class="btn">Fechar</button></form>`;
}
async function openAnalysis(id){
  const dlg = $("dlg");
  dlg.innerHTML = `<p class="note">A obter a análise mais recente…</p>`;
  if (!dlg.open) dlg.showModal();
  const ok = await fetchData(); render(); // vai sempre ao servidor: as análises podem ter sido acrescentadas ou atualizadas
  const close = `<form method="dialog"><button class="btn">Fechar</button></form>`;
  if (!ok){ dlg.innerHTML = `<div class="msg">Sem ligação à internet. O app precisa de estar online para mostrar as análises.</div>${close}`; return; }
  const f = [...S.fixtures, ...S.history].find(x => x.id === id);
  if (!f){ dlg.innerHTML = `<div class="msg">Este jogo já não está na lista atual.</div>${close}`; return; }
  dlg.innerHTML = f.analysis ? analysisHtml(f.analysis, f)
    : `<h3 style="margin:0">${esc(f.home_team)} vs ${esc(f.away_team)}</h3><div class="msg">${esc(f.analysis_note || "Ainda não há análise para esta partida.")}</div>${close}`;
}

/* ---------- Navegação e eventos ---------- */
function go(view, compId){
  S.view = view; S.compId = compId ?? null; S.drawer = false; S.search = false; drawerHtml();
  try { history.pushState({ v: view, c: compId ?? null }, ""); } catch {}
  render(); window.scrollTo && window.scrollTo(0, 0);
}
window.addEventListener("popstate", e => { const s = e.state || { v: "home", c: null }; S.view = s.v; S.compId = s.c; render(); });
document.addEventListener("click", e => {
  const el = e.target.closest("[data-nav],[data-comp],[data-tab],[data-day],[data-an],[data-del],[data-favtoggle],[data-favdel],[data-favopen],[data-act]"); if (!el) return;
  const d = el.dataset;
  if (d.act === "close"){ if (e.target !== el && el.classList.contains("ov") && e.target.closest(".drawer")) return; S.drawer = false; S.search = false; $("ov").innerHTML = ""; return; }
  if (d.act === "drawer"){ S.drawer = true; S.search = false; drawerHtml(); return; }
  if (d.act === "search"){ S.search = true; S.drawer = false; searchHtml(); return; }
  if (d.act === "next"){ const st = $("strip"); if (st && st.scrollBy) st.scrollBy({ left: 240, behavior: "smooth" }); return; }
  if (d.act === "analyze") return runNewAnalysis();
  if (d.favopen) return openFav(d.favopen);
  if (d.favtoggle){
    const r = S.ext; if (!r || r.f.id !== d.favtoggle) return;
    if (S.favs.some(x => x.id === r.f.id)) S.favs = S.favs.filter(x => x.id !== r.f.id);
    else S.favs = [...S.favs, { id: r.f.id, home_team: r.f.home_team, away_team: r.f.away_team, league: r.f.competitions.name, kickoff_utc: r.f.kickoff_utc, q: r.q }];
    saveFavs(); showExternal(r); render(); return;
  }
  if (d.favdel){
    if (window.confirm && !window.confirm("Remover este jogo dos favoritos?")) return;
    S.favs = S.favs.filter(x => x.id !== d.favdel); saveFavs();
    const dlg = $("dlg"); if (dlg.open && dlg.close) dlg.close();
    return render();
  }
  if (d.act === "restore"){ S.hidden = new Set(); store.set("hiddenHist", []); return render(); }
  if (d.del){ if (window.confirm && !window.confirm("Remover este jogo do histórico neste telemóvel?")) return; S.hidden.add(d.del); store.set("hiddenHist", [...S.hidden]); return render(); }
  if (d.act === "toggle"){ setTheme(isDark() ? "light" : "dark"); return; }
  if (d.day){ const st = $("strip"), sc = st ? st.scrollLeft : 0; S.day = d.day; render(); const n = $("strip"); if (n) n.scrollLeft = sc; return; }
  if (d.nav) return go(d.nav);
  if (d.comp) return go("comp", d.comp);
  if (d.tab){ S.tab = d.tab; return render(); }
  if (d.an) return openAnalysis(d.an);
});
document.addEventListener("input", e => { const k = ({ "na-home": "home", "na-away": "away", "na-league": "league" })[e.target.id]; if (k) S.na[k] = e.target.value; });
document.addEventListener("change", e => {
  if (e.target.id === "fcomp"){ S.comp = e.target.value; render(); }
});

document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
window.addEventListener("online", load);
applyTheme();
load();
setInterval(load, 30 * 60 * 1000);
</script>
