<body>
<noscript><p style="padding:20px;font:16px system-ui">Este site precisa de JavaScript ativo no navegador.</p></noscript>
<div id="app"><p style="text-align:center;padding:40px 12px;font:16px system-ui;color:#5b6b85">A carregar Elephalpit Bet…</p></div>
<div id="ov"></div>
<dialog id="dlg"></dialog>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let S = { view: "home", compId: null, raw: [], rawHist: [], fixtures: [], history: [], hidden: new Set(store.get("hiddenHist", [])), leagues: [], lastSync: null, lastFinal: null, msg: null, loading: true, tab: "all", comp: "", day: "",
  tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
  theme: store.get("theme", "auto"), drawer: false, search: false, q: "",
  na: { home: "", away: "", league: "" }, favs: store.get("favSearch", []), ext: null };

/* MODEL:BEGIN (gerado a partir de model.ts) */
const MODEL = (() => {
// Modelo estatístico "poisson-v2": puro, sem dependências, testável.
const MODEL_VERSION = "poisson-v2";
const MIN_MATCHES = 5;      // sem isto não se apresenta previsão quantitativa
const SHRINK_K = 5;         // jogos "virtuais" da média da amostra (reduz extremos)
const HOME_ADV = 1.1;       // fator casa: λ_casa × 1.1, λ_fora ÷ 1.1
const HT_SHARE = 0.45;      // fração aproximada dos golos na 1.ª parte
const MIN10_SHARE = 0.10;   // fração aproximada dos golos nos primeiros 10 minutos
const MAXG = 10;
const fact = (n) => { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; };
const pois = (k, l) => Math.exp(-l) * Math.pow(l, k) / fact(k);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
function grid(lh, la) {
  const g= []; let tot = 0;
  for (let i = 0; i <= MAXG; i++) { g[i] = []; for (let j = 0; j <= MAXG; j++) { g[i][j] = pois(i, lh) * pois(j, la); tot += g[i][j]; } }
  for (const row of g) for (let j = 0; j <= MAXG; j++) row[j] /= tot; // normaliza a truncagem
  return g;
}
function result1x2(g) {
  let h = 0, d = 0, a = 0;
  g.forEach((row, i) => row.forEach((p, j) => { if (i > j) h += p; else if (i === j) d += p; else a += p; }));
  return { home: h, draw: d, away: a };
}
function analyze(inp){
  const valid = (m) => Number.isFinite(m.gf) && Number.isFinite(m.ga) && m.gf >= 0 && m.ga >= 0;
  const H = inp.home.filter(valid), A = inp.away.filter(valid);
  if (H.length < MIN_MATCHES || A.length < MIN_MATCHES)
    return { ok: false, reason: `Dados insuficientes: são precisos pelo menos ${MIN_MATCHES} jogos recentes de cada equipa (tem ${H.length} e ${A.length}).` };
  const all = [...H, ...A];
  const mu = Math.max(0.3, all.reduce((s, m) => s + m.gf, 0) / all.length); // média de golos por equipa/jogo na amostra
  const str = (ms) => {
    const n = ms.length, gf = ms.reduce((s, m) => s + m.gf, 0), ga = ms.reduce((s, m) => s + m.ga, 0);
    return { att: (gf + SHRINK_K * mu) / (n + SHRINK_K) / mu, def: (ga + SHRINK_K * mu) / (n + SHRINK_K) / mu };
  };
  const h = str(H), a = str(A);
  const lh = clamp(mu * h.att * a.def * HOME_ADV, 0.2, 4.5);
  const la = clamp(mu * a.att * h.def / HOME_ADV, 0.2, 4.5);
  const g = grid(lh, la);
  const total = (k, over) => { let p = 0; g.forEach((r, i) => r.forEach((q, j) => { if ((i + j > k) === over) p += q; })); return p; };
  const totals= {};
  for (const k of [0.5, 1.5, 2.5, 3.5]) totals[`over_${String(k).replace(".", "_")}`] = total(k, true);
  for (const k of [1.5, 2.5, 3.5]) totals[`under_${String(k).replace(".", "_")}`] = total(k, false);
  let yes = 0; g.forEach((r, i) => r.forEach((q, j) => { if (i > 0 && j > 0) yes += q; }));
  const tg = (l) => { const p0 = pois(0, l), p1 = pois(1, l), p2 = pois(2, l); return { "0": p0, "1": p1, "2": p2, "3+": 1 - p0 - p1 - p2 }; };
  const scores= [];
  g.forEach((r, i) => r.forEach((q, j) => scores.push({ score: `${i}-${j}`, p: q })));
  scores.sort((x, y) => y.p - x.p);
  const none = g[0][0];
  // Parte mais produtiva: golos da 1.ª vs 2.ª parte (Poisson independentes, taxa total × fração da parte)
  const lt = lh + la, h1 = HT_SHARE, h2 = 1 - HT_SHARE;
  let pf = 0, pd = 0, ps = 0, ptot = 0;
  for (let i = 0; i <= MAXG; i++) for (let j = 0; j <= MAXG; j++) {
    const p = pois(i, lt * h1) * pois(j, lt * h2); ptot += p;
    if (i > j) pf += p; else if (i === j) pd += p; else ps += p;
  }
  // Uma equipa marca nas duas partes: P(≥1 na 1.ª) × P(≥1 na 2.ª)
  const both = (l) => { const y = (1 - Math.exp(-l * h1)) * (1 - Math.exp(-l * h2)); return { yes: y, no: 1 - y }; };
  // Alcance de golos: P(total ≥ n)
  const ge = (n) => { let p = 0; g.forEach((r, i) => r.forEach((q, j) => { if (i + j >= n) p += q; })); return p; };
  const nm = Math.min(H.length, A.length);
  return {
    ok: true, model: MODEL_VERSION, lambda: { home: lh, away: la },
    result: result1x2(g), totals, btts: { yes, no: 1 - yes },
    halftime: result1x2(grid(lh * HT_SHARE, la * HT_SHARE)),
    teamGoals: { home: tg(lh), away: tg(la) },
    exactScores: scores.slice(0, 5),
    productiveHalf: { first: pf / ptot, draw: pd / ptot, second: ps / ptot },
    bothHalves: { home: both(lh), away: both(la) },
    reach: { ge3: ge(3), ge4: ge(4), ge5: ge(5), ge6: ge(6) },
    min10: result1x2(grid(lh * MIN10_SHARE, la * MIN10_SHARE)),
    firstToScore: { home: (1 - none) * lh / (lh + la), away: (1 - none) * la / (lh + la), none },
    quality: { homeMatches: H.length, awayMatches: A.length, level: nm >= 10 ? "boa" : nm >= 7 ? "razoavel" : "baixa" },
  };
}
return { analyze, MODEL_VERSION };
})();
/* MODEL:END */

/* Fonte de dados para ligas FORA das 10 (ainda não ligada).
   Contrato: find({home, away, league, from, to}) -> { event:{id, home, away, league, kickoff_utc, time_confirmed}, homeHistory:[{gf,ga}], awayHistory:[{gf,ga}] }
   Em caso de erro lança Error com .code = "notfound" | "league" | "offline". */
const EXTRA_SOURCE = null;

/* ---------- Tema ---------- */
function applyTheme(){ const r = document.documentElement; if (S.theme === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.theme); }
const isDark = () => S.theme === "dark" || (S.theme === "auto" && !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches));
function setTheme(t){ S.theme = t; store.set("theme", t); applyTheme(); drawerHtml(); }

/* ---------- Dados ---------- */
async function fetchData(){
  try {
    const r = await fetch("fixtures.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);

  const st = f.status, t = Date.parse(f.kickoff_utc), now = Date.now();

function liveMinute(f){
  if (f.status === "HT") return "Intervalo";
  const m = Number(f.minute), at = f._at || Date.parse(S.lastSync) || 0, age = Math.floor((Date.now() - at) / 60000);
  if (Number.isFinite(m) && m > 0 && at && age <= 3){ // minuto REAL da fonte de dados
    const mm = m + Math.max(0, age);
    if (f.status === "1H" && mm > 45) return "45+'";
    if (mm > 90 && f.status !== "ET") return "90+'";
    return mm + "'";
  }
  // sem minuto real: relógio aproximado a partir do apito inicial (marcado com ~), com intervalo de 15 min
  const e = Math.floor((Date.now() - Date.parse(f.kickoff_utc)) / 60000);

// Procura nos jogos das 10 competições (dados já importados e analisados), sempre depois de ir ao servidor
async function lookupInternal(q, now, to){
  if (!(await fetchData())) throw coded("offline");
  reclassify();
  const open = S.fixtures.filter(f => ["NS", "TBD"].includes(f.status) && Date.parse(f.kickoff_utc) >= now && Date.parse(f.kickoff_utc) <= to);
  const hit = open.filter(f => nameOk(q.home, f.home_team) && nameOk(q.away, f.away_team) && leagueOk(f, q.league)).sort((a, b) => a.kickoff_utc.localeCompare(b.kickoff_utc))[0];
  if (!hit){
    const swapped = open.find(f => nameOk(q.home, f.away_team) && nameOk(q.away, f.home_team) && leagueOk(f, q.league));
    if (swapped) throw coded("swapped", `Encontrei o jogo, mas com a casa e o visitante trocados: casa ${swapped.home_team}, fora ${swapped.away_team}. Troca os campos.`);
    const other = open.find(f => nameOk(q.home, f.home_team) && nameOk(q.away, f.away_team));
    if (other) throw coded("league", `Encontrei esse jogo noutra competição (${other.competitions?.name}). Escreve essa liga para analisar.`);
    return null;
  }
  if (!hit.analysis) throw coded("insufficient", hit.analysis_note || "Ainda não há análise para este jogo.");
  const qa = hit.analysis.result.quality ?? {};
  return { f: { id: "fx:" + hit.id, home_team: hit.home_team, away_team: hit.away_team, competitions: hit.competitions, kickoff_utc: hit.kickoff_utc, time_confirmed: hit.time_confirmed, status: "NS" },
    an: hit.analysis, q,
    note: `Base: últimos ${qa.homeMatches ?? "?"} jogos da casa e ${qa.awayMatches ?? "?"} do visitante. Qualidade dos dados: ${qa.level ?? "?"}. Fonte: football-data.org (competições do app).` };
}
async function lookup(q){
  const now0 = Date.now(), to0 = now0 + 30 * DAY;
  const internal = await lookupInternal(q, now0, to0);
  if (internal) return internal;
  if (!EXTRA_SOURCE) throw coded(knownLeague(q.league) ? "notfound" : "nosource");
  const now = Date.now(), to = now + 30 * DAY;
  let res;
  try { res = await EXTRA_SOURCE.find({ ...q, from: new Date(now).toISOString(), to: new Date(to).toISOString() }); }
  catch (err){ throw err && err.code ? err : coded("offline"); }
  const ev = res && res.event;
  if (!ev) throw coded("notfound");
  const t = Date.parse(ev.kickoff_utc);
  if (!(t >= now && t <= to)) throw coded("notfound"); // regra do app: só jogos publicados dos próximos 30 dias
  if (ev.league && !loose(ev.league, q.league)) throw coded("league", `Encontrei esse jogo noutra competição (${ev.league}). Escreve essa liga para analisar.`);
  const out = MODEL.analyze({ home: res.homeHistory ?? [], away: res.awayHistory ?? [] });
  if (!out.ok) throw coded("insufficient", out.reason);
  const f = { id: "ext:" + ev.id, home_team: ev.home, away_team: ev.away, competitions: { name: ev.league || q.league, country: "" },
    kickoff_utc: ev.kickoff_utc, time_confirmed: ev.time_confirmed !== false, status: "NS" };
  const an = { model_version: MODEL.MODEL_VERSION, created_at: new Date().toISOString(), result: out };
  const note = `Base: últimos ${out.quality.homeMatches} jogos da casa e ${out.quality.awayMatches} do visitante. Qualidade dos dados: ${out.quality.level}. Fonte: ${EXTRA_SOURCE.name ?? "externa"}.`;
  return { f, an, note, q };
}

const ck = k => k.replace(".", ",");
// arredonda as percentagens de um mercado para inteiros que somam sempre 100
function lr(ps){
  const f = ps.map(p => Math.floor(p * 100 + 1e-9));
  let rest = 100 - f.reduce((a, b) => a + b, 0);
  ps.map((p, i) => [p * 100 - f[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (rest > 0){ f[i]++; rest--; } });
  return f;
}

const poi = (k, l) => { let f = 1; for (let i = 2; i <= k; i++) f *= i; return Math.exp(-l) * Math.pow(l, k) / f; };
function sections(r, nm){

  const topI = items => items.reduce((b, x, i) => (x[1] > items[b][1] ? i : b), 0);
  const excl = (items, yes = () => "Sim") => { const t = topI(items); return items.map(([l, p, fn], i) => ({ l, p, fn, v: i === t ? yes(i) : "Não", pick: i === t })); };
  const one = (l, p, fn, pick) => ({ l, p, fn, v: null, pick });
  const noHt = f => f.hh == null || f.ah == null;
  const win = i => (i === 1 ? "Sim" : "Vence");

  { const it = [[H, r.result.home, f => f.h > f.a, "h"], ["Empate", r.result.draw, f => f.h === f.a, "d"], [A, r.result.away, f => f.h < f.a, "a"]];
    const n = lr(it.map(x => x[1])), diff = Math.abs(n[0] - n[2]);
    const favI = n[0] >= n[2] ? 0 : 2, dogI = favI === 0 ? 2 : 0;
    if (diff < 5){
      out.push({ title: "Resultado final", pct: true, groups: [[{ l: "1X2", p: r.result.home + r.result.away, fn: f => f.h !== f.a, v: "Qualquer vence", pick: true }]] });
    } else if (diff <= 10 && n[1] > n[dogI] && n[1] <= n[favI]){
      const fav = it[favI][3] === "h"; // favorita em casa: "Vence/Empata"; favorita fora: "Empate/Vence"
      const rows = it.map(([l, p, fn, k], i) => {
        if (i === favI) return { l, p, fn: fav ? (f => f.h >= f.a) : (f => f.h <= f.a), v: fav ? "Vence/Empata" : "Empate/Vence", pick: true };
        if (k === "d") return { l, p, fn, v: "Talvez Sim", pick: false };
        return { l, p, fn, v: "Não vence", pick: false };
      });
      out.push({ title: "Resultado final", pct: true, groups: [rows] });
    } else {
      out.push({ title: "Resultado final", pct: true, groups: [excl(it.map(([l, p, fn, k]) => [k === "d" ? l : `${l} vence`, p, fn]))] });
    }
  }
  const t = r.totals, tg = [];
  for (const [k, key] of [["0.5", "0_5"], ["1.5", "1_5"], ["2.5", "2_5"], ["3.5", "3_5"]]){
    const over = t["over_" + key], under = t["under_" + key];
    if (over == null) continue;
    const ov = f => f.h + f.a > +k, un = f => f.h + f.a < +k;
    if (under != null){ const o = over >= under; tg.push([one(`Mais de ${ck(k)}`, over, ov, o), one(`Menos de ${ck(k)}`, under, un, !o)]); }
    else tg.push([one(`Mais de ${ck(k)}`, over, ov, over >= 0.5)]);
  }
  out.push({ title: "Total de golos", pct: true, groups: tg });
  if (r.reach) out.push({ title: "Alcance de golos", pct: true, groups: [[4, r.reach.ge4], [5, r.reach.ge5], [6, r.reach.ge6]].filter(x => x[1] != null).map(([n, p]) => [one(`${n}+`, p, f => f.h + f.a >= n, p >= 0.5)]) });
  const by = r.btts.yes >= r.btts.no;
  out.push({ title: "Ambas as equipas marcam", pct: true, groups: [[one("Sim", r.btts.yes, f => f.h > 0 && f.a > 0, by), one("Não", r.btts.no, f => !(f.h > 0 && f.a > 0), !by)]] });
  out.push({ title: "Resultado ao intervalo", pct: true, groups: [excl([[H, r.halftime.home, f => noHt(f) ? null : f.hh > f.ah], ["Empate", r.halftime.draw, f => noHt(f) ? null : f.hh === f.ah], [A, r.halftime.away, f => noHt(f) ? null : f.hh < f.ah]], win)] });
  const g1 = f => f.hh + f.ah, g2 = f => f.h + f.a - (f.hh + f.ah);
  if (r.productiveHalf) out.push({ title: "Parte mais produtiva", pct: true, groups: [excl([["Primeira parte", r.productiveHalf.first, f => noHt(f) ? null : g1(f) > g2(f)], ["Empate", r.productiveHalf.draw, f => noHt(f) ? null : g1(f) === g2(f)], ["Segunda parte", r.productiveHalf.second, f => noHt(f) ? null : g1(f) < g2(f)]])] });
  if (r.lambda){
    const wh = (l1, l2) => { let w = 0; for (let i = 0; i <= 10; i++) for (let j = 0; j < i; j++) w += poi(i, l1) * poi(j, l2); return w; };
    const anyHalf = (lf, lo) => 1 - (1 - wh(lf * 0.45, lo * 0.45)) * (1 - wh(lf * 0.55, lo * 0.55)); // vence pelo menos uma das partes
    const ph = anyHalf(r.lambda.home, r.lambda.away), pa = anyHalf(r.lambda.away, r.lambda.home);
    const hw = side => f => noHt(f) ? null : side === "h" ? (f.hh > f.ah || (f.h - f.hh) > (f.a - f.ah)) : (f.ah > f.hh || (f.a - f.ah) > (f.h - f.hh));
    out.push({ title: "Vence qualquer parte", pct: true, groups: [
      [{ l: H, p: ph, fn: hw("h"), v: ph >= 0.5 ? "Sim" : "Não", pick: ph >= 0.5 }],
      [{ l: A, p: pa, fn: hw("a"), v: pa >= 0.5 ? "Sim" : "Não", pick: pa >= 0.5 }]] });
  }
  if (r.bothHalves){
    const bh = side => f => noHt(f) ? null : (side === "h" ? f.hh > 0 && f.h - f.hh > 0 : f.ah > 0 && f.a - f.ah > 0);
    const ph = r.bothHalves.home.yes, pa = r.bothHalves.away.yes, best = Math.max(ph, pa), pH = best >= 0.5 && ph >= pa, pA = best >= 0.5 && !pH;
    const no = side => f => { const v = bh(side)(f); return v === null ? null : !v; };
    out.push({ title: "Marca duas partes", pct: true, groups: [
      [one(`${H}: Sim`, ph, bh("h"), ph >= 0.5), one(`${H}: Não`, 1 - ph, no("h"), ph < 0.5)],
      [one(`${A}: Sim`, pa, bh("a"), pa >= 0.5), one(`${A}: Não`, 1 - pa, no("a"), pa < 0.5)]] });

  if (r.min10) out.push({ title: "1X2 aos 10 minutos", pct: true, groups: [excl([[H, r.min10.home, f => z10(f) ? false : null], ["Empate", r.min10.draw, f => z10(f) ? true : null], [A, r.min10.away, f => z10(f) ? false : null]], win)] });
  const bucket = (obj, side) => { const items = Object.entries(obj).map(([k, p]) => [`${k} golo${k === "1" ? "" : "s"}`, p, f => (k === "3+" ? f[side] >= 3 : f[side] === +k)]); const tp = topI(items); return items.map(([l, p, fn], i) => one(l, p, fn, i === tp)); };
  out.push({ title: "Golos da equipa da casa", pct: true, groups: [bucket(r.teamGoals.home, "h")] });
  out.push({ title: "Golos da equipa visitante", pct: true, groups: [bucket(r.teamGoals.away, "a")] });
  const ex = r.exactScores[0];
  out.push({ title: "Resultado exato mais provável", pct: true, groups: [[one(ex.score, ex.p, f => `${f.h}-${f.a}` === ex.score, true)]] });
  // quem marcou primeiro só é certo se uma das equipas não marcou
  const first = f => (f.h + f.a === 0 ? "none" : f.a === 0 ? "home" : f.h === 0 ? "away" : null);
  out.push({ title: "Quem marca primeiro", pct: true, groups: [excl([[H, r.firstToScore.home, f => { const v = first(f); return v === null ? null : v === "home"; }], ["Sem golos", r.firstToScore.none, f => f.h + f.a === 0], [A, r.firstToScore.away, f => { const v = first(f); return v === null ? null : v === "away"; }]])] });
  return out;
}
const ints = (sec, g) => !sec.pct ? [] : g.length > 1 ? lr(g.map(x => x.p)) : g.map(x => Math.round(x.p * 100));
const occ = (x, fin) => { if (!fin) return null; const o = x.fn(fin); return o === null || o === undefined ? null : o; };
// verde/vermelho: a frase mostrada (ex.: "Empate Não") estava certa?
const rowOk = (x, fin) => { const o = occ(x, fin); return o === null ? null : (String(x.v).startsWith("Não") ? !o : o); };
// o modelo acertou neste mercado? (a opção escolhida aconteceu; se não escolheu nenhuma, nenhuma das linhas aconteceu)
function groupHit(g, fin){
  if (!fin) return null;
  const pk = g.find(x => x.pick);
  if (pk) return occ(pk, fin);
  const os = g.map(x => occ(x, fin));
  return os.some(o => o === null) ? null : os.every(o => !o);
}
function analysisHtml(an, f, extra = ""){

  const secs = sections(r, { h: f.home_team, a: f.away_team });

  const row = (x, n, sec, sub) => {
    const lab = `<span>${esc(x.l)}${sub ? `<br><small style="color:var(--mute)">${esc(sec.title)}</small>` : ""}</span>`;
    return sec.pct
      ? (x.v ? `<div class="rp wd">${lab}<b class="v">${esc(x.v)}</b><span class="trk"><span style="width:${n}%"></span></span><strong>${n}%</strong>${dot(rowOk(x, fin))}</div>`
             : `<div class="rp">${lab}<span class="trk"><span style="width:${n}%"></span></span><strong>${n}%</strong>${dot(rowOk(x, fin))}</div>`)
      : `<div class="rp nv">${lab}<strong class="v">${esc(x.v ?? "")}</strong>${dot(rowOk(x, fin))}</div>`;
  };
  const body = secs.map(sec => `<div class="sec">${esc(sec.title)}</div>` + sec.groups.map(g => { const n = ints(sec, g); return g.map((x, i) => row(x, n[i], sec, false)).join(""); }).join("")).join("");

  return `<h3 style="font-size:22px;margin:0">${esc(f.home_team)} vs ${esc(f.away_team)}</h3>
    <p class="note">${esc(f.competitions?.name ?? "")} · ${esc(fmtDay(f.kickoff_utc))}, ${esc(fmtHour(f.kickoff_utc))}</p>${legend}
    ${body}
    <div class="sec">As 5 análises mais prováveis deste jogo</div>${topHtml}
    <p class="note">Previsão calculada em ${esc(fmtFull(an.created_at))}${fin ? (an.retro ? " (análise reconstruída depois do jogo, só com resultados anteriores a ele; não foi uma previsão feita antes)" : " (antes do jogo; nunca é alterada)") : ""}. São estimativas estatísticas, não garantias.</p>

    <form method="dialog"><button class="btn">Fechar</button></form>`;
}

async function api(op, body){
  try {
    const t = store.get(SESK, null);
    const r = await fetch(API_URL.replace(/\/$/, "") + "/" + op, { method: "POST", headers: { "Content-Type": "application/json", ...(t ? { Authorization: "Bearer " + t } : {}) }, body: JSON.stringify(body || {}) });
    let d = {}; try { d = await r.json(); } catch {}
    return { ...d, status: r.status };
  } catch { return { status: 0, error: "Sem ligação ao servidor. Tenta outra vez." }; }
}
const banMsg = (t, who) => `${who} está banida até ${tm(t)}.`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const rnd = () => { try { return crypto.getRandomValues(new Uint32Array(1))[0]; } catch { return Math.floor(Math.random() * 4294967295); } };
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
const validName = n => n.length >= 3 && n.length <= 20 && /^[\p{L}\p{N}_. -]+$/u.test(n);
const tm = t => { const iso = new Date(t).toISOString(); return dayKey(iso) === dayKey(new Date().toISOString()) ? fmtHour(iso) : fmtFull(iso); };

async function hashPw(pw, salt){
  try {
    const enc = new TextEncoder();
    const k = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
    const b = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: enc.encode(salt), iterations: 100000, hash: "SHA-256" }, k, 256);
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  } catch {
    let h = 2166136261; const s = salt + "|" + pw;
    for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return "f" + (h >>> 0).toString(16);
  }
}

const err = t => { S.soc.err = t; S.soc.info = ""; render(); return false; };
async function doRegister(){
  const f = S.soc.f, e = f.email.trim().toLowerCase(), n = f.name.trim();
  if (!validEmail(e)) return err("Escreve um e-mail válido.");
  if (!validName(n)) return err("O nome de utilizador deve ter 3 a 20 caracteres (letras, números, espaço, _ . -).");
  if (f.pw.length < 6) return err("A palavra-passe deve ter pelo menos 6 caracteres.");
  const salt = uid(), hash = await hashPw(f.pw, salt);
  if (API_URL){
    const r = await api("register", { email: e, name: n, salt, hash });
    return r.ok ? startSession(r) : err(r.error || "Não foi possível criar a conta.");
  }
  reloadDB();
  if (DBc.users.some(u => u.email === e)) return err("Este e-mail já está registado.");
  if (DBc.users.some(u => norm(u.name) === norm(n))) return err("Este nome de utilizador já existe.");
  const u = { id: uid(), email: e, name: n, salt, hash, photo: "", friends: [], admin: e === ADMIN_EMAIL, banUntil: 0, created: Date.now() };
  DBc.users.push(u); saveDB(); store.set(SESK, u.id);
  S.pwPlain = S.soc.f.pw; S.soc.f.pw = ""; S.soc.err = ""; S.soc.info = ""; S.view = "home"; startBusy(); render();
}
async function doLogin(){
  const { id, pw } = S.soc.f, key = id.trim();
  if (!key || !pw) return err("Escreve o e-mail (ou nome) e a palavra-passe.");
  if (API_URL){
    const s1 = await api("salt", { id: key }); if (!s1.salt) return err(s1.error || "Sem ligação ao servidor. Tenta outra vez.");
    const r = await api("login", { id: key, hash: await hashPw(pw, s1.salt) });
    if (r.ok) return startSession(r);
    return err(r.error === "banned" ? banMsg(r.banUntil, "Esta conta") : (r.error || "E-mail/nome ou palavra-passe incorretos."));
  }
  reloadDB();
  const u = DBc.users.find(x => x.email === key.toLowerCase() || norm(x.name) === norm(key));
  const ok = u && u.hash === await hashPw(pw, u.salt);
  if (!ok) return err("E-mail/nome ou palavra-passe incorretos.");
  if (u.banUntil > Date.now()) return err(`Esta conta está banida até ${tm(u.banUntil)}.`);
  store.set(SESK, u.id); S.pwPlain = S.soc.f.pw; S.soc.f.pw = ""; S.soc.err = ""; S.soc.info = ""; S.view = "home"; startBusy(); render();
}
async function sendMail(to, code){
  if (MAIL_ENDPOINT){
    try { const r = await fetch(MAIL_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ to, subject: "Código de recuperação - Elephalpit Bet", code }) }); if (r.ok) return; } catch {}
  }
  S.soc.mail = { to, code }; // modo demonstração
}
async function doForgot1(){
  const e = S.soc.f.email.trim().toLowerCase();
  if (!validEmail(e)) return err("Escreve um e-mail válido.");
  S.soc.mail = null;
  if (API_URL){
    const r = await api("forgot1", { email: e }); if (!r.ok) return err(r.error || "Sem ligação ao servidor.");
    if (r.demoCode) S.soc.mail = { to: e, code: r.demoCode };
  } else {
  reloadDB();
  if (DBc.users.some(u => u.email === e)){
    const code = String(rnd() % 900000 + 100000), h = await hashPw(code, e);
    reloadDB(); DBc.resets[e] = { h, exp: Date.now() + 600000, tries: 0 }; saveDB();
    await sendMail(e, code);
  }
  }
  S.soc.mode = "forgot2"; S.soc.err = "";
  S.soc.info = "Se este e-mail estiver registado, foi enviado um código de 6 dígitos (válido 10 minutos).";
  render();
}
async function doForgot2(){
  const e = S.soc.f.email.trim().toLowerCase(), code = S.soc.f.code.trim(), pw2 = S.soc.f.pw2;
  if (pw2.length < 6) return err("A nova palavra-passe deve ter pelo menos 6 caracteres.");
  const h = await hashPw(code, e), salt = uid(), nh = await hashPw(pw2, salt);
  if (API_URL){
    const r = await api("forgot2", { email: e, code, salt, hash: nh }); if (!r.ok) return err(r.error || "Sem ligação ao servidor.");
    Object.assign(S.soc.f, { id: e, pw: "", code: "", pw2: "" }); S.soc.mail = null; S.soc.mode = "login"; S.soc.err = "";
    S.soc.info = "Palavra-passe alterada. Já podes entrar."; return render();
  }
  reloadDB();
  const r = DBc.resets[e];
  if (!r || r.exp < Date.now()) return err("Código inválido ou expirado. Pede um novo.");
  if (r.tries >= 5){ delete DBc.resets[e]; saveDB(); return err("Demasiadas tentativas. Pede um novo código."); }
  if (r.h !== h){ r.tries++; saveDB(); return err("Código incorreto."); }
  const u = DBc.users.find(x => x.email === e); if (!u) return err("Conta não encontrada.");
  u.salt = salt; u.hash = nh; delete DBc.resets[e]; saveDB();
  Object.assign(S.soc.f, { id: e, pw: "", code: "", pw2: "" }); S.soc.mail = null; S.soc.mode = "login"; S.soc.err = "";
  S.soc.info = "Palavra-passe alterada. Já podes entrar."; render();
}

  if (d.act === "leagues"){ S.lg = true; S.drawer = false; S.search = false; leaguesHtml(); return; }
  if (d.act === "lgtoggle"){
    if (S.sel.includes(d.id)) S.sel = S.sel.filter(x => x !== d.id); else if (S.sel.length < 3) S.sel = [...S.sel, d.id];
    store.set("calLeagues", S.sel); leaguesHtml(); render(); return;
  }
  if (d.act === "lgclear"){ S.sel = []; store.set("calLeagues", S.sel); leaguesHtml(); render(); return; }
  if (d.act === "back") return goBack();
  if (d.act === "drawer"){ S.drawer = true; S.search = false; drawerHtml(); return; }
  if (d.act === "search"){ S.search = true; S.drawer = false; searchHtml(); return; }
  if (d.act === "next"){ const st = $("strip"); if (st && st.scrollBy) st.scrollBy({ left: 240, behavior: "smooth" }); return; }
  if (d.act === "analyze") return runNewAnalysis();
  if (d.favopen) return openFav(d.favopen);
  if (d.favtoggle){
    const r = S.ext; if (!r || r.f.id !== d.favtoggle) return;
    if (S.favs.some(x => x.id === r.f.id)) S.favs = S.favs.filter(x => x.id !== r.f.id);
    else S.favs = [...S.favs, { id: r.f.id, home_team: r.f.home_team, away_team: r.f.away_team, league: r.f.competitions.name, kickoff_utc: r.f.kickoff_utc, q: r.q }];
    saveFavs(); showExternal(r); render(); return;
  }
  if (d.favdel){
    if (window.confirm && !window.confirm("Remover este jogo dos favoritos?")) return;
    S.favs = S.favs.filter(x => x.id !== d.favdel); saveFavs();
    const dlg = $("dlg"); if (dlg.open && dlg.close) dlg.close();
    return render();
  }
  if (d.del){ if (window.confirm && !window.confirm("Remover este jogo do histórico para sempre? Não dá para desfazer.")) return; S.hidden.add(d.del); store.set("hiddenHist", [...S.hidden]); return render(); }
  if (d.act === "toggle"){ setTheme(isDark() ? "light" : "dark"); return; }
  if (d.vday){ const st = $("vstrip"), sc = st ? st.scrollLeft : 0; S.vday = d.vday; render(); const n = $("vstrip"); if (n) n.scrollLeft = sc; return; }
  if (d.day){ const st = $("strip"), sc = st ? st.scrollLeft : 0; S.day = d.day; render(); const n = $("strip"); if (n) n.scrollLeft = sc; return; }
  if (d.nav) return go(d.nav);
  if (d.comp) return go("comp", d.comp);
  if (d.tab){ S.tab = d.tab; return render(); }
  if (d.an) return openAnalysis(d.an);
});
document.addEventListener("input", e => { const k = ({ "na-home": "home", "na-away": "away", "na-league": "league" })[e.target.id]; if (k) S.na[k] = e.target.value; });
document.addEventListener("change", e => {
  if (e.target.id === "fcomp"){ S.comp = e.target.value; render(); }
});

document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
window.addEventListener("online", load);
// transições automáticas: jogo terminado -> Histórico (sem precisar de atualizar a página)
const stateSig = () => { reclassify(); return dayKey(new Date().toISOString()) + "|" + S.fixtures.map(f => f.id + f.status + f.home_goals + f.away_goals + "").join(",") + "|" + S.history.length; };
const AUTO_VIEWS = ["home", "comp", "cal", "fav", "hist", "vip"];
let lastSig = "";
const checkState = () => { if (!cur()) return; const g = stateSig(); const first = lastSig === ""; if (g !== lastSig){ lastSig = g; if (!first && AUTO_VIEWS.includes(S.view)) render(); } };
setInterval(checkState, 15000);
const hotNow = () => { const now = Date.now(); return S.raw.some(f => !isDone(f.status) && Math.abs(Date.parse(f.kickoff_utc) - now) < 3 * 3600e3); };
// durante um jogo (ou perto do apito): placar e minuto reais de 20 em 20 s (fonte em tempo real) e o fixtures.json de minuto a minuto
setInterval(async () => { if (document.visibilityState !== "visible" || !cur() || !hotNow()) return; if (await fetchLive()) checkState(); }, 20000);
setInterval(async () => { if (document.visibilityState !== "visible" || !cur() || !hotNow()) return; await fetchData(); checkState(); }, 60000);
// calendário automático: volta a ler o fixtures.json de 1 em 1 minuto (e ao voltar ao separador), sem recarregar a página
let lastPull = Date.now();
const pullCal = async () => { lastPull = Date.now(); await fetchData(); checkState(); };
setInterval(() => { if (document.visibilityState === "visible" && cur() && Date.now() - lastPull > 55000) pullCal(); }, 60000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && cur() && Date.now() - lastPull > 30000) pullCal(); });
try { history.replaceState({ v: "home", c: null, i: 0 }, ""); } catch {}
applyTheme();
load();
setInterval(load, 30 * 60 * 1000);
</script>
