<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elephalpit Bet</title>
<style>
:root{--kbg:#fff;--kfg:#0f1f3a;--kmute:#5b6b85;--kchip:#eef3fa;--kline:#d6dfec;--kbd:#cfd8e6;--bg:#f1f6fc;--card:#fff;--ink:#0f1f3a;--mute:#5b6b85;--line:#cfe3f7;--blue:#0b5ec5;--blue2:#1478e0;--amber:#f2b705;--ok:#1fa463;--bad:#d93025;--grey:#9aa7ba;--hdr:#0b5ec5;--tint:#eaf3fd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--kbg:#000;--kfg:#fff;--kmute:#aaa;--kchip:#1c1c1e;--kline:#333;--kbd:#3a3a3c;--bg:#0b1220;--card:#131d31;--ink:#e8eefb;--mute:#93a3bf;--line:#243452;--blue:#2f86ea;--blue2:#5aa2f5;--hdr:#0a3f86;--tint:#18253d}}
:root[data-theme="dark"]{--kbg:#000;--kfg:#fff;--kmute:#aaa;--kchip:#1c1c1e;--kline:#333;--kbd:#3a3a3c;--bg:#0b1220;--card:#131d31;--ink:#e8eefb;--mute:#93a3bf;--line:#243452;--blue:#2f86ea;--blue2:#5aa2f5;--hdr:#0a3f86;--tint:#18253d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
header.top{position:sticky;top:0;z-index:5;background:var(--hdr);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.ib{background:none;border:0;color:#fff;padding:6px;display:grid;place-items:center}
.ib svg{width:28px;height:28px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:.2px}
.brand em{font-style:normal;color:#9cc9ff}
.mark{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font-size:18px}
main{max-width:760px;margin:0 auto;padding:12px 12px calc(88px + env(safe-area-inset-bottom,0px))}
.ttl{font-size:24px;text-align:center;margin:8px 0 12px}
.sub{color:var(--mute);font-size:14px;margin:0 0 8px;text-align:center}
.comp{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.ball{font-size:30px;text-align:center}
.ct b{display:block;font-size:18px}
.ct i{color:var(--blue2);display:flex;align-items:center;gap:6px;font-size:16px}
.cnt{border:1px solid var(--line);background:var(--tint);border-radius:6px;padding:4px 10px;font-size:14px;color:var(--blue2);white-space:nowrap}
.cnt b{font-size:24px}
.msg{margin:8px 0;padding:10px 12px;border-radius:8px;font-size:14px;background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.msg.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px}
.tab[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
select,input[type=search],input[type=text],input[type=email],input[type=password],input[type=number]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.day{margin:18px 0 6px;font-size:18px;text-transform:capitalize;border-bottom:3px solid var(--amber);display:inline-block;padding-right:12px}
.cn{margin:10px 0 6px;color:var(--mute);font-weight:600;font-size:14px}
.match{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:10px;padding:12px;margin-bottom:8px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.t{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.t.r{justify-content:flex-end;text-align:right}
.t img{width:26px;height:26px;object-fit:contain}
.t span{overflow-wrap:anywhere}
.vs{font-size:22px;font-weight:800;text-align:center;min-width:60px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;color:var(--mute);font-size:14px}
.st{border-radius:6px;padding:2px 8px;background:var(--tint);border:1px solid var(--line)}
.st.live{background:var(--bad);color:#fff;border-color:var(--bad)}
.match{position:relative}
.fl{display:block;font-weight:700;margin:12px 0 4px}
.dt{color:var(--grey);font-size:12px;margin-bottom:6px}
.x{position:absolute;top:2px;right:2px;width:36px;height:36px;border:0;background:none;color:var(--grey);font-size:18px;line-height:1;border-radius:8px}
.x:active{background:var(--tint)}
.link{background:none;border:0;color:var(--blue2);text-decoration:underline;padding:8px 0}
.row{display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;background:var(--blue);color:#fff}
.btn.amber{background:var(--amber);color:#1b1500}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.5}
.fav{background:none;border:0;font-size:22px;color:var(--amber);line-height:1}
.empty{text-align:center;color:var(--mute);padding:36px 12px}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--hdr);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px))}
nav.bot button{position:relative;background:none;border:0;color:#cfe1fb;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:4px 1px}
nav.bot button[aria-current=page]{color:#fff;font-weight:800}
nav.bot svg{width:26px;height:26px}
.ov{position:fixed;inset:0;z-index:20;background:#0009;display:flex}
.drawer{background:var(--card);width:min(320px,86vw);height:100%;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;overflow:auto}
.drawer h3{margin:18px 0 8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 4px}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.sp{background:var(--bg);width:100%;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 12px;overflow:auto}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:460px;width:calc(100% - 24px);max-height:90vh;overflow:auto;padding:16px}
dialog::backdrop{background:#0009}
.kh{background:var(--kbg);color:var(--kfg);border-radius:12px;padding:16px 10px 14px;margin-bottom:10px;text-align:center}
.kh .kl{color:var(--kmute);font-size:14px;letter-spacing:.3px;text-transform:uppercase}
.kh .kt{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin-top:12px}
.kh .tm{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;font-weight:600;word-break:break-word}
.kh .tm img,.kh .tm i{width:54px;height:54px;border-radius:50%;background:#fff;border:3px solid var(--kbd);object-fit:contain;padding:5px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-style:normal;color:#1c1c1e;font-weight:800;font-size:20px}
.kh .kc b{display:block;font-size:34px;line-height:1.05;font-weight:700}
.kh .kc span{display:block;color:var(--kmute);font-size:13px;margin-top:4px;text-transform:uppercase}
.kh .kc .cd{font-size:20px;color:var(--kfg);font-weight:600;font-variant-numeric:tabular-nums;margin-top:8px;letter-spacing:.5px}
.chat{display:flex;flex-direction:column;gap:8px;margin:10px 0;max-height:360px;overflow:auto}
.bub{padding:9px 12px;border-radius:14px;font-size:15px;max-width:88%;line-height:1.4;background:var(--bg2,#8881);border:1px solid var(--line);align-self:flex-start}
.bub.me{align-self:flex-end;background:var(--brand,#1976d2);color:#fff;border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:16px;padding:6px 10px;font-size:13px;cursor:pointer}
.tipcard h3{margin:0 0 6px}.tipcard ul,.tipcard ol{margin:6px 0;padding-left:20px}.tipcard li{margin:4px 0;font-size:15px}
.sec{font-weight:800;font-size:17px;margin:16px 0 4px}
.warn{font-weight:800;font-size:13px;text-align:center;margin:10px 0 0;letter-spacing:.2px}
.vtabs{display:flex;justify-content:center;gap:16px;margin:2px 0 8px}
.vtb{background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);font-size:19px;font-weight:800;padding:2px 4px;cursor:pointer}
.vtb[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--amber)}
.rp{display:grid;grid-template-columns:1fr 64px 42px 14px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:15px}
.trk{height:8px;border-radius:4px;background:var(--tint);overflow:hidden;display:block}
.trk span{display:block;height:100%;background:var(--blue2)}
.rp strong{text-align:right}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot.g{background:var(--ok)}.dot.r{background:var(--bad)}.dot.n{border:2px solid var(--grey)}
.note{color:var(--mute);font-size:13px;margin:6px 0}
.stripw{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px 2px 2px 4px;margin:0 0 8px}
.strip{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dy{background:none;border:0;border-radius:8px;min-width:44px;padding:2px 3px;display:flex;flex-direction:column;align-items:center;color:var(--mute);font-size:11px;font-weight:600}
.dy b{font-size:16px;color:var(--ink);line-height:1.1}
.dy i{width:4px;height:4px;border-radius:50%;margin-top:1px}
.dy i.has{background:var(--blue2)}
.dy[aria-pressed=true]{background:linear-gradient(135deg,#f0148c,#b800b8);color:#fff}
.dy[aria-pressed=true] b{color:#fff}
.dy[aria-pressed=true] i.has{background:#fff}
.nx{background:none;border:0;font-size:20px;color:var(--mute);padding:0 8px}
.sum{background:var(--tint);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 8px;font-size:14px}

/* ---- contas, perfil, chat, painel ---- */
.bdg{position:absolute;top:0;left:calc(50% + 4px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#e11d2e;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;line-height:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:16px 0 4px}
.auth{max-width:420px;margin:0 auto;padding:18px 14px;min-height:calc(100vh - 80px);min-height:calc(100dvh - 80px);display:flex;flex-direction:column;justify-content:center}
.av{width:var(--s,40px);height:var(--s,40px);border-radius:50%;object-fit:cover;background:var(--blue);color:#fff;display:inline-grid;place-items:center;font-weight:800;font-size:calc(var(--s,40px)*.45);flex:none}
.phead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.val{padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--tint);overflow-wrap:anywhere}
.mbtn{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:7px 12px;font-weight:700}
.frow,.conv{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);width:100%}
.conv{background:none;border-width:0 0 1px;text-align:left}
.nm{font-weight:700;text-align:left;flex:1;text-decoration:none;padding:4px 0}
.cm{flex:1;display:flex;flex-direction:column;min-width:0}
.cm small{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bdg2{background:#e11d2e;color:#fff;border-radius:9px;min-width:20px;padding:1px 6px;text-align:center;font-size:12px;font-weight:800}
.chl{height:min(52vh,420px);overflow:auto;background:var(--tint);border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.bub{max-width:82%;align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--blue);color:#fff;border-color:var(--blue)}
.bub b{font-size:12px;color:var(--blue2)}
.bub small{font-size:11px;opacity:.7;align-self:flex-end}
.send{display:flex;gap:8px}
.sbar{position:relative;margin:8px 0}
.sbar input{padding-right:42px}
.lupa{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--mute);display:grid}
.lupa svg{width:22px;height:22px}
.big{font-size:18px;font-weight:800;text-decoration:none;color:var(--ink)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:13px;color:var(--mute)}
.stat b{display:block;font-size:26px;color:var(--ink)}
.urow{padding:10px 0;border-bottom:1px solid var(--line)}
.urow .row{flex-wrap:wrap;margin-top:6px}
.tag{background:var(--amber);color:#1b1500;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:800;margin-left:6px}
.mail{background:var(--tint);border:2px dashed var(--amber);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.mail strong{font-size:22px;letter-spacing:4px}
.mrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rp.nv{grid-template-columns:1fr auto 14px}
.rp .v{font-weight:800;text-align:right}
.mo{font-style:normal;font-size:9px;color:var(--amber);min-height:10px;line-height:10px}
.lgb{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 10px;margin-bottom:3px;font-size:13px}
.lgb b{font-size:13px}.lgb .note{font-size:11px}.lgsp{padding-top:calc(6px + env(safe-area-inset-top,0px))!important}
.lgb[aria-pressed=true]{border-color:var(--blue);background:var(--tint)}
.lgb .ck{width:18px;height:18px;font-size:12px;border:2px solid var(--grey);border-radius:6px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.lgb[aria-pressed=true] .ck{background:var(--blue);border-color:var(--blue)}
/* olho, transição */
.pwbox{position:relative}
.pwbox input{padding-right:46px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;padding:8px;color:var(--mute);display:grid;place-items:center}
.val.pwv{position:relative;padding-right:46px}
.val.pwv .eye{right:2px}
.ldr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:55vh;color:var(--mute)}
.ring{width:48px;height:48px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--blue2);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{width:min(240px,70vw);height:6px;border-radius:3px;background:var(--tint);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--blue2);animation:bar linear forwards}
@keyframes bar{to{width:100%}}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main.fi{animation:fi .1s ease}
#off{position:fixed;inset:0;z-index:1000;background:#000;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:700;padding:24px}
#off.on{display:flex}
/* Sim/Não com percentagem */
.rp.wd{grid-template-columns:minmax(0,1fr) auto 40px 40px 14px}
.rp.wd .v{text-align:right;font-weight:800;white-space:nowrap}
.vsw{text-align:center}
.mn{color:var(--bad);font-weight:800;font-size:14px;margin-top:2px}
/* ao vivo */
.vs.lv{color:var(--bad)}
.st.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:6px;animation:pl 1.2s infinite}
@keyframes pl{50%{opacity:.25}}

.match{padding:8px 10px;margin-bottom:6px}
.dt{font-size:11px;margin-bottom:3px}
.t img{width:22px;height:22px}
.t{gap:6px;font-size:15px}
.vs{font-size:19px;min-width:52px}
.meta{margin-top:6px;font-size:13px}
.match .btn{padding:6px 12px;font-size:14px}
/* análise em ecrã inteiro */
dialog:has(.dtop){background:var(--kbg);width:100%;max-width:none;height:100%;max-height:none;margin:0;border:0;border-radius:0;padding:0 14px 20px}
dialog:has(.dtop) > *:not(.dtop){max-width:560px;margin-left:auto;margin-right:auto}
.dtop{position:sticky;top:0;z-index:2;background:var(--kbg);padding:10px 0;margin:0 -14px 6px;padding-right:10px;display:flex;justify-content:flex-end}
.dtop form{margin:0}
.dbk{background:none;border:0;color:var(--ink);font-size:28px;line-height:1;padding:4px 12px;cursor:pointer;border-radius:8px}
.kh .frm{margin-top:12px;border-top:1px solid var(--kline);padding-top:10px;text-align:left}
.kh .frm h4{margin:0 0 8px;text-align:center;font-size:12px;color:var(--kmute);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.kh .fc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kh .fr{display:flex;align-items:center;gap:6px;margin-bottom:5px}.kh .fr.r{flex-direction:row-reverse}
.kh .fb{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;background:var(--kchip);border:1px solid var(--kbd);border-radius:8px;padding:3px 4px;font-size:13px;font-weight:700}
.kh .fb img,.kh .fb i{width:22px;height:22px;border-radius:50%;background:#fff;object-fit:contain;padding:2px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-style:normal;color:#1c1c1e;font-size:11px;font-weight:800}
.kh .fl{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex:none}
.kh .fl.V{background:#1fb15f}.kh .fl.E{background:#e0a800}.kh .fl.D{background:#d9534f}
.kh .hh{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.kh .hh i,.kh .hh img{width:22px;height:22px;border-radius:50%;background:#fff;object-fit:contain;padding:2px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-style:normal;color:#1c1c1e;font-size:11px;font-weight:800}
.kh .hh div{background:var(--kchip);border:1px solid var(--kbd);border-radius:8px;padding:5px 10px;display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px}
/* Ajuda */
.help{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;color:#fff;display:flex;flex-direction:column;z-index:20}
.help .hb{position:absolute;top:8px;left:8px;background:none;border:0;color:#fff;font-size:30px;padding:6px 14px;cursor:pointer}
.help .hm{flex:1;overflow:auto;padding:56px 16px 10px;display:flex;flex-direction:column;gap:10px}
.help .hq{margin:auto;font-size:26px;font-weight:600;text-align:center}
.help .bub{background:#1e1e1e;border:0;color:#fff;max-width:92%}
.help .bub.me{background:#2f2f2f;color:#fff}
.help .chips{justify-content:center;padding:0 12px}
.help .chips button{border-color:#444;color:#ddd}
.help .hbar{display:flex;align-items:center;gap:8px;margin:8px 12px calc(14px + env(safe-area-inset-bottom,0px));background:#212121;border-radius:28px;padding:6px 6px 6px 16px}
.help .hbar input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:16px;min-width:0;padding:8px 0}
.help .hbar .hp{font-size:24px;color:#ccc;line-height:1}
.help .hbar button{width:38px;height:38px;border-radius:50%;border:0;background:#fff;color:#000;font-size:18px;cursor:pointer}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#aaa;animation:dt 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes dt{0%,60%,100%{opacity:.25}30%{opacity:1}}
.fv{background:none;border:0;color:var(--amber,#e0a800);font-size:24px;line-height:1;padding:0 6px;cursor:pointer}
</style>

/* MODEL:BEGIN (gerado a partir de model.ts) */
const MODEL = (() => {
// Modelo estatístico "poisson-v2": puro, sem dependências, testável.
const MODEL_VERSION = "poisson-v2";
const MIN_MATCHES = 5;      // abaixo disto a análise continua a ser feita, mas marcada como de baixa fiabilidade
const SHRINK_K = 5;         // jogos "virtuais" da média da amostra (reduz extremos)
const HOME_ADV = 1.1;       // fator casa: λ_casa × 1.1, λ_fora ÷ 1.1
const HT_SHARE = 0.45;      // fração aproximada dos golos na 1.ª parte
const MIN10_SHARE = 0.10;   // fração aproximada dos golos nos primeiros 10 minutos
const MAXG = 10;
const fact = (n) => { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; };
const pois = (k, l) => Math.exp(-l) * Math.pow(l, k) / fact(k);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
function grid(lh, la) {
  const g= []; let tot = 0;
  for (let i = 0; i <= MAXG; i++) { g[i] = []; for (let j = 0; j <= MAXG; j++) { g[i][j] = pois(i, lh) * pois(j, la); tot += g[i][j]; } }
  for (const row of g) for (let j = 0; j <= MAXG; j++) row[j] /= tot; // normaliza a truncagem
  return g;
}
function result1x2(g) {
  let h = 0, d = 0, a = 0;
  g.forEach((row, i) => row.forEach((p, j) => { if (i > j) h += p; else if (i === j) d += p; else a += p; }));
  return { home: h, draw: d, away: a };
}
function analyze(inp){
  const valid = (m) => Number.isFinite(m.gf) && Number.isFinite(m.ga) && m.gf >= 0 && m.ga >= 0;
  const dt = (m) => Date.parse(m.date ?? m.utcDate ?? m.kickoff_utc ?? "") || 0;
  const last5 = (ms) => (ms || []).filter(valid).map((m, i) => [m, i]).sort((x, y) => (dt(y[0]) - dt(x[0])) || (x[1] - y[1])).slice(0, 5).map(x => x[0]); // as 5 mais recentes
  const H = last5(inp.home), A = last5(inp.away), X = last5(inp.h2h); // X = confrontos diretos (gf = golos da equipa da casa de agora)
  const all = [...H, ...A];
  const mu = all.length ? Math.max(0.3, all.reduce((s, m) => s + m.gf, 0) / all.length) : 1.35; // média de golos por equipa/jogo na amostra
  const str = (ms) => {
    const n = ms.length, gf = ms.reduce((s, m) => s + m.gf, 0), ga = ms.reduce((s, m) => s + m.ga, 0);
    return { att: (gf + SHRINK_K * mu) / (n + SHRINK_K) / mu, def: (ga + SHRINK_K * mu) / (n + SHRINK_K) / mu };
  };
  const h = str(H), a = str(A);
  const ha = (H.length >= MIN_MATCHES && A.length >= MIN_MATCHES) ? HOME_ADV : 1; // com poucos jogos, só contam os dados reais (sem fator casa)
  let lh0 = mu * h.att * a.def * ha, la0 = mu * a.att * h.def / ha;
  if (X.length){ // confrontos diretos: peso até 30% (cresce com o número de jogos, máx. 5)
    const w = 0.3 * X.length / 5, xh = X.reduce((s, m) => s + m.gf, 0) / X.length, xa = X.reduce((s, m) => s + m.ga, 0) / X.length;
    lh0 = (1 - w) * lh0 + w * xh; la0 = (1 - w) * la0 + w * xa;
  }
  const lh = clamp(lh0, 0.2, 4.5);
  const la = clamp(la0, 0.2, 4.5);
  const g = grid(lh, la);
  const total = (k, over) => { let p = 0; g.forEach((r, i) => r.forEach((q, j) => { if ((i + j > k) === over) p += q; })); return p; };
  const totals= {};
  for (const k of [0.5, 1.5, 2.5, 3.5]) totals[`over_${String(k).replace(".", "_")}`] = total(k, true);
  for (const k of [1.5, 2.5, 3.5]) totals[`under_${String(k).replace(".", "_")}`] = total(k, false);
  let yes = 0; g.forEach((r, i) => r.forEach((q, j) => { if (i > 0 && j > 0) yes += q; }));
  const tg = (l) => { const p0 = pois(0, l), p1 = pois(1, l), p2 = pois(2, l); return { "0": p0, "1": p1, "2": p2, "3+": 1 - p0 - p1 - p2 }; };
  const scores= [];
  g.forEach((r, i) => r.forEach((q, j) => scores.push({ score: `${i}-${j}`, p: q })));
  scores.sort((x, y) => y.p - x.p);
  const none = g[0][0];
  // Parte mais produtiva: golos da 1.ª vs 2.ª parte (Poisson independentes, taxa total × fração da parte)
  const lt = lh + la, h1 = HT_SHARE, h2 = 1 - HT_SHARE;
  let pf = 0, pd = 0, ps = 0, ptot = 0;
  for (let i = 0; i <= MAXG; i++) for (let j = 0; j <= MAXG; j++) {
    const p = pois(i, lt * h1) * pois(j, lt * h2); ptot += p;
    if (i > j) pf += p; else if (i === j) pd += p; else ps += p;
  }
  // Uma equipa marca nas duas partes: P(≥1 na 1.ª) × P(≥1 na 2.ª)
  const both = (l) => { const y = (1 - Math.exp(-l * h1)) * (1 - Math.exp(-l * h2)); return { yes: y, no: 1 - y }; };
  // Alcance de golos: P(total ≥ n)
  const ge = (n) => { let p = 0; g.forEach((r, i) => r.forEach((q, j) => { if (i + j >= n) p += q; })); return p; };
  const nm = Math.min(H.length, A.length);
  return {
    ok: true, model: MODEL_VERSION, lambda: { home: lh, away: la },
    result: result1x2(g), totals, btts: { yes, no: 1 - yes },
    halftime: result1x2(grid(lh * HT_SHARE, la * HT_SHARE)),
    teamGoals: { home: tg(lh), away: tg(la) },
    exactScores: scores.slice(0, 5),
    productiveHalf: { first: pf / ptot, draw: pd / ptot, second: ps / ptot },
    bothHalves: { home: both(lh), away: both(la) },
    reach: { ge3: ge(3), ge4: ge(4), ge5: ge(5), ge6: ge(6) },
    min10: result1x2(grid(lh * MIN10_SHARE, la * MIN10_SHARE)),
    firstToScore: { home: (1 - none) * lh / (lh + la), away: (1 - none) * la / (lh + la), none },
    quality: { homeMatches: H.length, awayMatches: A.length, h2h: X.length, level: nm >= 10 ? "boa" : nm >= 7 ? "razoavel" : "baixa" },
  };
}
return { analyze, MODEL_VERSION };
})();
/* MODEL:END */

function liveMinute(f){

async function lookupInternal(q, now, to){
  if (!(await fetchData())) throw coded("offline");
  reclassify();
  const open = S.fixtures.filter(f => ["NS", "TBD"].includes(f.status) && Date.parse(f.kickoff_utc) >= now && Date.parse(f.kickoff_utc) <= to);

    const swapped = open.find(f => nameOk(q.home, f.away_team) && nameOk(q.away, f.home_team) && leagueOk(f, q.league));
    if (swapped) throw coded("swapped", `Encontrei o jogo, mas com a casa e o visitante trocados: casa ${swapped.home_team}, fora ${swapped.away_team}. Troca os campos.`);
    const other = open.find(f => nameOk(q.home, f.home_team) && nameOk(q.away, f.away_team));

}
async function lookup(q){

  if (ev.league && !loose(ev.league, q.league)) throw coded("league", `Encontrei esse jogo noutra competição (${ev.league}). Escreve essa liga para analisar.`);

}

/* ---------- Análise e avaliação (círculos verde/vermelho) ---------- */
const ck = k => k.replace(".", ",");
// arredonda as percentagens de um mercado para inteiros que somam sempre 100
function lr(ps){
  const f = ps.map(p => Math.floor(p * 100 + 1e-9));
  let rest = 100 - f.reduce((a, b) => a + b, 0);
  ps.map((p, i) => [p * 100 - f[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (rest > 0){ f[i]++; rest--; } });
  return f;
}
// Cada linha: l = texto, p = probabilidade, fn = "isto aconteceu?" (true/false/null se não há dados), v = Sim/Não/Vence, pick = escolha do modelo
// jogo sem análise guardada ou com poucos dados: calcula na mesma (estimativa genérica, baixa fiabilidade)
const genericAn = f => ({ model_version: MODEL.MODEL_VERSION, created_at: new Date().toISOString(), result: MODEL.analyze({ home: [], away: [] }), generic: true, retro: isDone(f.status) });
const poi = (k, l) => { let f = 1; for (let i = 2; i <= k; i++) f *= i; return Math.exp(-l) * Math.pow(l, k) / f; };
function sections(r, nm){
  const H = nm?.h || "Casa", A = nm?.a || "Fora", out = [];
  const topI = items => items.reduce((b, x, i) => (x[1] > items[b][1] ? i : b), 0);
  const excl = (items, yes = () => "Sim") => { const t = topI(items); return items.map(([l, p, fn], i) => ({ l, p, fn, v: i === t ? yes(i) : "Não", pick: i === t })); };
  const one = (l, p, fn, pick) => ({ l, p, fn, v: null, pick });
  const noHt = f => f.hh == null || f.ah == null;
  const win = i => (i === 1 ? "Sim" : "Vence");
  // 1X2: diferença entre as duas equipas < 5 => "Qualquer vence"; 5 a 10 (jogo equilibrado) => Vence/Empata + Talvez Sim; maior => Sim/Não
  { const it = [[H, r.result.home, f => f.h > f.a, "h"], ["Empate", r.result.draw, f => f.h === f.a, "d"], [A, r.result.away, f => f.h < f.a, "a"]];
    const n = lr(it.map(x => x[1])), diff = Math.abs(n[0] - n[2]);
    const favI = n[0] >= n[2] ? 0 : 2, dogI = favI === 0 ? 2 : 0;
    if (diff < 5){
      out.push({ title: "Resultado final", pct: true, groups: [[{ l: "1X2", p: r.result.home + r.result.away, fn: f => f.h !== f.a, v: "Qualquer vence", pick: true }]] });
    } else if (diff <= 10 && n[1] > n[dogI] && n[1] <= n[favI]){
      const fav = it[favI][3] === "h"; // favorita em casa: "Vence/Empata"; favorita fora: "Empate/Vence"
      const rows = it.map(([l, p, fn, k], i) => {
        if (i === favI) return { l, p, fn: fav ? (f => f.h >= f.a) : (f => f.h <= f.a), v: fav ? "Vence/Empata" : "Empate/Vence", pick: true };
        if (k === "d") return { l, p, fn, v: "Talvez Sim", pick: false };
        return { l, p, fn, v: "Não vence", pick: false };
      });
      out.push({ title: "Resultado final", pct: true, groups: [rows] });
    } else {
      out.push({ title: "Resultado final", pct: true, groups: [excl(it.map(([l, p, fn, k]) => [k === "d" ? l : `${l} vence`, p, fn]))] });
    }
  }
  const t = r.totals, tg = [];
  for (const [k, key] of [["0.5", "0_5"], ["1.5", "1_5"], ["2.5", "2_5"], ["3.5", "3_5"]]){
    const over = t["over_" + key], under = t["under_" + key];
    if (over == null) continue;
    const ov = f => f.h + f.a > +k, un = f => f.h + f.a < +k;
    if (under != null){ const o = over >= under; tg.push([one(`Mais de ${ck(k)}`, over, ov, o), one(`Menos de ${ck(k)}`, under, un, !o)]); }
    else tg.push([one(`Mais de ${ck(k)}`, over, ov, over >= 0.5)]);
  }
  out.push({ title: "Total de golos", pct: true, groups: tg });
  if (r.reach) out.push({ title: "Alcance de golos", pct: true, groups: [[4, r.reach.ge4], [5, r.reach.ge5], [6, r.reach.ge6]].filter(x => x[1] != null).map(([n, p]) => [one(`${n}+`, p, f => f.h + f.a >= n, p >= 0.5)]) });
  const by = r.btts.yes >= r.btts.no;
  out.push({ title: "Ambas as equipas marcam", pct: true, groups: [[one("Sim", r.btts.yes, f => f.h > 0 && f.a > 0, by), one("Não", r.btts.no, f => !(f.h > 0 && f.a > 0), !by)]] });
  out.push({ title: "Resultado ao intervalo", pct: true, groups: [excl([[H, r.halftime.home, f => noHt(f) ? null : f.hh > f.ah], ["Empate", r.halftime.draw, f => noHt(f) ? null : f.hh === f.ah], [A, r.halftime.away, f => noHt(f) ? null : f.hh < f.ah]], win)] });

      [{ l: H, p: ph, fn: hw("h"), v: ph >= 0.5 ? "Sim" : "Não", pick: ph >= 0.5 }],

    const ph = r.bothHalves.home.yes, pa = r.bothHalves.away.yes, best = Math.max(ph, pa), pH = best >= 0.5 && ph >= pa, pA = best >= 0.5 && !pH;
    const no = side => f => { const v = bh(side)(f); return v === null ? null : !v; };

  out.push({ title: "Golos da equipa da casa", pct: true, groups: [bucket(r.teamGoals.home, "h")] });

  }
}

  S.soc.info = "Palavra-passe alterada. Já podes entrar."; render();

function allowSave(email, o, okMsg){

  if (API_URL){ api("admin/allow", { email, ...o }).then(r => { if (r.ok){ S.soc.amsg = okMsg || "Guardado."; refreshAdmin(); render(); } else msg("!" + (r.error || "Erro.")); }); return; }

    const left = tadmLeft(me); if (o.days > left) return msg(`!Só podes convidar até ${left} ${dword(left)}.`);
    const a0 = allowOf(email); if (a0 && a0.exp > now && a0.by !== me.email) return msg("!Este utilizador já tem VIP.");

  }
  if (d.favdel){
    if (window.confirm && !window.confirm("Remover este jogo dos favoritos?")) return;
    S.favs = S.favs.filter(x => x.id !== d.favdel); saveFavs();
    const dlg = $("dlg"); if (dlg.open && dlg.close) dlg.close();
    return render();
  }
  if (d.del){ if (window.confirm && !window.confirm("Remover este jogo do histórico para sempre? Não dá para desfazer.")) return; S.hidden.add(d.del); store.set("hiddenHist", [...S.hidden]); return render(); }
  if (d.act === "toggle"){ setTheme(isDark() ? "light" : "dark"); return; }
  if (d.vday){ const st = $("vstrip"), sc = st ? st.scrollLeft : 0; S.vday = d.vday; render(); const n = $("vstrip"); if (n) n.scrollLeft = sc; return; }
  if (d.day){ const st = $("strip"), sc = st ? st.scrollLeft : 0; S.day = d.day; render(); const n = $("strip"); if (n) n.scrollLeft = sc; return; }
  if (d.nav) return go(d.nav);
  if (d.comp) return go("comp", d.comp);
  if (d.tab){ S.tab = d.tab; return render(); }
  if (d.an) return openAnalysis(d.an);
});
document.addEventListener("input", e => { const k = ({ "na-home": "home", "na-away": "away", "na-league": "league" })[e.target.id]; if (k) S.na[k] = e.target.value; });
document.addEventListener("change", e => {
  if (e.target.id === "fcomp"){ S.comp = e.target.value; render(); }
});

document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
window.addEventListener("online", load);
// transições automáticas: começa -> Ao vivo, termina -> Histórico (sem precisar de atualizar a página)
const stateSig = () => { reclassify(); return dayKey(new Date().toISOString()) + "|" + S.fixtures.map(f => f.id + f.status + f.home_goals + f.away_goals + "").join(",") + "|" + S.history.length; };
const AUTO_VIEWS = ["home", "comp", "cal", "fav", "hist", "vip"];
let lastSig = "";
const checkState = () => { if (!cur()) return; const g = stateSig(); const first = lastSig === ""; if (g !== lastSig){ lastSig = g; if (!first && AUTO_VIEWS.includes(S.view)) render(); } };
setInterval(checkState, 15000);
const hotNow = () => { const now = Date.now(); return S.raw.some(f => !isDone(f.status) && Math.abs(Date.parse(f.kickoff_utc) - now) < 3 * 3600e3); };
// durante um jogo (ou perto do apito): placar e minuto reais de 20 em 20 s (fonte em tempo real) e o fixtures.json de minuto a minuto
setInterval(async () => { if (document.visibilityState !== "visible" || !cur() || !hotNow()) return; if (await fetchLive()) checkState(); }, 20000);
setInterval(async () => { if (document.visibilityState !== "visible" || !cur() || !hotNow()) return; await fetchData(); checkState(); }, 60000);
// calendário automático: volta a ler o fixtures.json de 1 em 1 minuto (e ao voltar ao separador), sem recarregar a página
let lastPull = Date.now();
const pullCal = async () => { lastPull = Date.now(); await fetchData(); checkState(); };
setInterval(() => { if (document.visibilityState === "visible" && cur() && Date.now() - lastPull > 55000) pullCal(); }, 60000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && cur() && Date.now() - lastPull > 30000) pullCal(); });
try { history.replaceState({ v: "home", c: null, i: 0 }, ""); } catch {}
applyTheme();
load();
setInterval(load, 30 * 60 * 1000);
</script>
</body>
