name: Atualizar calendário
on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 15 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      final:
        description: "Última atualização do dia?"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: update-calendar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Atualizar jogos
        run: node update.mjs
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          FINAL_RUN: ${{ (github.event.schedule == '30 21 * * *' || github.event.inputs.final == 'true') && '1' || '0' }}
      - name: Guardar alterações
        if: always()
        run: |
          git config user.name "calendar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add fixtures.json
          git diff --cached --quiet || (git commit -m "Atualiza calendário" && git push)
